function SettingsBackup({ s, modules, mod, savedAt, onReset, onImport, notify }) {
  const fileRef = useRef(null);
  const totalClients = modules.reduce((sum, m) => sum + (m.clients || []).length, 0);
  const stamp = todayISO();

  const exportJSON = () => {
    downloadFile("prospera-crm-backup-" + stamp + ".json", serializeBackup(modules, s), "application/json");
    notify({ title: "Backup exportado", message: "Guarde o arquivo em um lugar seguro." });
  };
  const exportCSV = () => {
    const cur = mod.fields.find((f) => f.type === "currency");
    const head = ["Nome", "Empresa", "Telefone", "E-mail", "Etapa", "Origem", "Responsável", "Porte", "Interesse", "Prioridade (pontos)", "Dias na etapa", "Motivo da perda",
      mod.itemLabelPlural, "Qtd. itens", "Valor total", "Observações", "Cadastrado em", "Atualizado em"];
    const rows = mod.clients.map((c) => {
      const im = interesseMeta(c.interesse);
      const score = scoreClient(s, mod, c);
      return [
        c.nome, c.empresa, c.telefone, c.email, statusMeta(c.status).label,
        origemLabel(s, c.origem), vendedorNome(s, c.responsavel), porteLabel(c.porte), im ? im.label : "",
        score.points, daysInStage(c), c.status === "perdido" ? motivoLabel(s, c.motivoPerda) : "",
        (c.items || []).map((it) => itemTitle(mod, it) + (cur ? " (" + BRL(itemValue(mod, it)) + ")" : "")).join(" | "),
        (c.items || []).length, clientValue(mod, c).toFixed(2).replace(".", ","), c.obs, fmtDateTime(c.createdAt), fmtDateTime(c.updatedAt),
      ];
    });
    const csv = "﻿" + [head, ...rows].map((r) => r.map(csvCell).join(";")).join("\r\n");
    downloadFile("prospera-crm-" + mod.id + "-" + stamp + ".csv", csv, "text/csv;charset=utf-8");
    notify({ title: "Planilha exportada", message: mod.clients.length + " cliente(s) de " + mod.nome });
  };
  const onFile = (e) => {
    const file = e.target.files && e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = () => {
      try {
        const parsed = JSON.parse(String(reader.result));
        const result = parseBackup(parsed);
        if (!result || !Array.isArray(result.modules) || result.modules.length === 0) throw new Error("formato");
        onImport({ modules: result.modules, settings: result.settings || null });
      } catch (err) {
        notify({ title: "Arquivo inválido", message: "Escolha um backup .json gerado por este CRM.", kind: "error" });
      }
    };
    reader.readAsText(file);
    e.target.value = "";
  };

  const Row = ({ icon: IconC, title, text, children, tone }) => (
    <div className={"flex flex-col gap-3 rounded-xl border p-4 sm:flex-row sm:items-center " + (tone === "danger" ? "border-red-100 bg-red-50/40" : "border-slate-200 bg-white")}>
      <span className={"flex h-10 w-10 shrink-0 items-center justify-center rounded-xl " + (tone === "danger" ? "bg-red-100 text-red-600" : "bg-slate-100 text-slate-500")}><IconC size={18} /></span>
      <div className="min-w-0 flex-1">
        <div className="text-sm font-semibold text-ink">{title}</div>
        <div className="text-xs leading-relaxed text-slate-500">{text}</div>
      </div>
      <div className="flex shrink-0 gap-2">{children}</div>
    </div>
  );

  return (
    <div className="space-y-4">
      <SettingsInfo>
        <b className="text-ink">Os dados ficam somente neste navegador.</b> Hoje são {modules.length} módulo(s), {totalClients} cliente(s) e as configurações.
        Nada é enviado para servidores, então limpar o histórico do navegador apaga tudo. Exporte um backup de vez em quando.
        {savedAt && <span className="mt-1 block text-xs text-slate-500">Último salvamento automático: {fmtDateTime(new Date(savedAt).toISOString())}</span>}
      </SettingsInfo>

      <div className="space-y-3">
        <Row icon={I.Download} title="Exportar backup completo" text="Arquivo .json com todos os módulos, clientes e configurações (equipe, automações, modelos). Serve para restaurar em outro computador.">
          <button type="button" onClick={exportJSON} className={btn.primary}><I.Download size={16} /> Exportar</button>
        </Row>
        <Row icon={I.Upload} title="Importar backup" text="Substitui os dados atuais pelos do arquivo .json escolhido. Aceita backups da versão anterior.">
          <input ref={fileRef} type="file" accept="application/json,.json" className="hidden" onChange={onFile} />
          <button type="button" onClick={() => fileRef.current && fileRef.current.click()} className={btn.secondary}><I.Upload size={16} /> Escolher arquivo</button>
        </Row>
        <Row icon={I.Table} title={"Exportar planilha de " + mod.nome} text="Arquivo .csv com os clientes do módulo atual (origem, responsável, prioridade, dias na etapa…), pronto para o Excel.">
          <button type="button" onClick={exportCSV} className={btn.secondary}><I.Table size={16} /> Exportar CSV</button>
        </Row>
        <Row icon={I.Reset} title="Restaurar dados de exemplo" text="Apaga tudo o que foi salvo (clientes e configurações) e volta aos dados iniciais de demonstração." tone="danger">
          <button type="button" onClick={onReset} className={btn.dangerSoft}><I.Reset size={16} /> Restaurar</button>
        </Row>
      </div>

      <div className="rounded-xl border border-slate-200 bg-white p-4">
        <div className="mb-2 flex items-center gap-2 text-sm font-semibold text-ink"><I.Keyboard size={16} className="text-slate-400" /> Atalhos</div>
        <ul className="grid grid-cols-1 gap-1.5 text-xs text-slate-600 sm:grid-cols-2">
          <li className="flex items-center gap-2"><Kbd>/</Kbd> Ir para a busca</li>
          <li className="flex items-center gap-2"><Kbd>n</Kbd> Novo cliente</li>
          <li className="flex items-center gap-2"><Kbd>Esc</Kbd> Fechar painel ou janela</li>
          <li className="flex items-center gap-2"><Kbd>Enter</Kbd> Salvar formulário</li>
          <li className="flex items-center gap-2 sm:col-span-2">Arrastar um card no funil muda a etapa</li>
        </ul>
      </div>
    </div>
  );
}

  const s = settingsSafe(settings);

  const allClients = modules.reduce((acc, m) => acc.concat(m.clients || []), []);

  const ref = useRef(null);
  useEffect(() => { ref.current && ref.current.focus(); }, []);

  return (
    <div className="fixed inset-0 z-[60] flex items-end justify-center p-0 sm:items-center sm:p-4" role="alertdialog" aria-modal="true" aria-label={title} onKeyDown={onKey}>

      <div className="relative w-full max-w-md rounded-t-3xl bg-white p-6 shadow-pop anim-sheet sm:rounded-2xl">

  );
}

/* Avisos no canto da tela. Cada aviso tem uma barra que mostra o tempo restante
   (mesmo tempo que o app usa para removê-lo); ao passar o mouse, a barra pausa e o
   aviso fica na tela até o mouse sair. No máximo 4 avisos visíveis. */
const TOAST_KINDS = {
  success: { icon: "Check", cls: "bg-emerald-50 text-emerald-600", bar: "text-emerald-500" },
  info:    { icon: "Info",  cls: "bg-brand-50 text-brand",          bar: "text-brand" },
  warning: { icon: "Alert", cls: "bg-amber-50 text-amber-600",      bar: "text-amber-500" },
  error:   { icon: "Alert", cls: "bg-red-50 text-red-600",          bar: "text-red-500" },
};
function Toasts({ toasts, onDismiss }) {
  const [held, setHeld] = useState([]);   // avisos que o app já removeu, mas o mouse ainda está em cima
  const hover = useRef(null);
  const last = useRef(toasts);
  useEffect(() => {
    if (hover.current) {
      const gone = last.current.filter((t) => t.id === hover.current && !toasts.some((x) => x.id === t.id));
      if (gone.length) setHeld((h) => [...h.filter((t) => !gone.some((g) => g.id === t.id)), ...gone]);
    }
    last.current = toasts;
  }, [toasts]);

  const list = [...toasts, ...held.filter((h) => !toasts.some((t) => t.id === h.id))].slice(-4);
  if (!list.length) return null;

  const dismiss = (id) => { setHeld((h) => h.filter((t) => t.id !== id)); onDismiss(id); };
  const onEnter = (id) => { hover.current = id; };
  const onLeave = (id) => { hover.current = null; setTimeout(() => setHeld((h) => h.filter((t) => t.id !== id)), 700); };

  return (
    <div className="pointer-events-none fixed bottom-4 right-4 z-[70] flex w-[min(380px,calc(100vw-2rem))] flex-col gap-2" aria-live="polite" aria-relevant="additions">
      {list.map((t) => {
        const k = TOAST_KINDS[t.kind] || TOAST_KINDS.success;
        const Ic = I[k.icon] || I.Check;
        const stuck = held.some((h) => h.id === t.id);
        return (
          <div key={t.id} role="status" onMouseEnter={() => onEnter(t.id)} onMouseLeave={() => onLeave(t.id)}
            className="toast pointer-events-auto relative flex items-start gap-3 overflow-hidden rounded-xl border border-slate-200 bg-white px-4 py-3 shadow-pop anim-toast">
            <span className={"flex h-8 w-8 shrink-0 items-center justify-center rounded-lg " + k.cls}><Ic size={17} /></span>
            <div className="min-w-0 flex-1 pt-0.5">
              <div className="text-sm font-semibold leading-snug text-ink">{t.title}</div>
              {t.message && <div className="mt-0.5 truncate text-xs text-slate-500">{t.message}</div>}
            </div>
            {t.action && (
              <button onClick={() => { t.action.onClick(); dismiss(t.id); }}
                className="shrink-0 rounded-lg px-2 py-1 text-xs font-bold text-brand transition hover:bg-brand-50">{t.action.label}</button>

/* -------------------------------- Relatórios ------------------------------
   Tela "Relatórios": conversão, tempos, motivos de perda, origens, vendedores
   e prioridade. Só CSS para os gráficos; helpers locais prefixados com "reports".
--------------------------------------------------------------------------- */
const REPORTS_PERIODS = [
  { key: "mes", label: "Este mês" },
  { key: "3m", label: "3 meses" },
  { key: "12m", label: "12 meses" },
  { key: "tudo", label: "Tudo" },
];

/* Data de corte (ISO "YYYY-MM-DD") para o período escolhido; null = sem corte. */
function reportsSince(key) {
  const d = new Date();
  if (key === "mes") return toISODate(new Date(d.getFullYear(), d.getMonth(), 1));
  if (key === "3m") { d.setMonth(d.getMonth() - 3); return toISODate(d); }
  if (key === "12m") { d.setMonth(d.getMonth() - 12); return toISODate(d); }
  return null;
}
function reportsPct(n, d) { return d > 0 ? Math.round((n / d) * 100) : 0; }
function reportsAvg(arr) { return arr.length ? arr.reduce((s, x) => s + x, 0) / arr.length : null; }
function reportsFmtDays(v) { return v == null ? "—" : (Math.round(v * 10) / 10).toLocaleString("pt-BR") + (v === 1 ? " dia" : " dias"); }
function reportsReachedNegotiation(c) {
  if (c.status === "negociacao" || c.status === "fechado") return true;
  return (c.stageLog || []).some((s) => s.status === "negociacao" || s.status === "fechado");
}

function ReportsChip({ active, onClick, children }) {
  return (
    <button type="button" onClick={onClick}
      className={"inline-flex items-center gap-1.5 rounded-full border px-3 py-1.5 text-xs font-semibold transition " + (active ? "border-transparent bg-ink text-white shadow-sm" : "border-slate-200 bg-white text-slate-600 hover:border-slate-300")}>
      {children}
    </button>
  );
}

/* Linha de gráfico de barras horizontal. */
function ReportsBarRow({ label, value, max, color, right, sub }) {

      <div className="w-36 min-w-0 shrink-0 sm:w-44">
        <div className="truncate font-medium text-slate-700">{label}</div>
        {sub && <div className="truncate text-[11px] text-slate-400">{sub}</div>}
      </div>

      <span className="w-24 shrink-0 text-right text-xs text-slate-500 tnum">{right}</span>
    </li>

}

function ReportsBigNumber({ label, value, sub, tone = "brand" }) {
  const tones = { brand: "bg-brand-50 text-brand", green: "bg-emerald-50 text-emerald-800", amber: "bg-amber-50 text-amber-800", slate: "bg-slate-50 text-slate-700" };

}

function Reports({ mod, clients, allModules, settings, onOpen }) {
  const [period, setPeriod] = useState("3m");
  const [allMods, setAllMods] = useState(false);

  /* Linhas da análise: { c, mod, valor }. Com "todos os módulos" ligado, o valor
     é calculado pelos campos do módulo de cada cliente. */
  const rows = useMemo(() => {
    const since = reportsSince(period);
    const source = allMods && allModules && allModules.length ? allModules : [mod];
    const list = [];
    source.forEach((m2) => (m2.clients || []).forEach((c) => {
      if (since && (c.createdAt || "") < since) return;
      list.push({ c, mod: m2, valor: clientValue(m2, c) });
    }));
    return list;
  }, [period, allMods, mod, allModules]);

  const data = useMemo(() => {
    const total = rows.length;
    const fechados = rows.filter((r) => r.c.status === "fechado");
    const perdidos = rows.filter((r) => r.c.status === "perdido");
    const abertos = rows.filter((r) => r.c.status === "lead" || r.c.status === "negociacao");
    const reached = rows.filter((r) => reportsReachedNegotiation(r.c)).length;

    /* 1. conversão em degraus */
    const steps = [
      { key: "cad", label: "Cadastrados", n: total, color: "#3152E4" },
      { key: "neg", label: "Chegaram a negociação", n: reached, color: "#D97706" },
      { key: "fec", label: "Fechados", n: fechados.length, color: "#047857" },
    ];

    /* 2. tempo médio por etapa (lead e negociação) + ciclo médio */
    const perStage = { lead: [], negociacao: [] };
    rows.forEach((r) => stageDurations(r.c).forEach((d) => { if (perStage[d.status]) perStage[d.status].push(d.days); }));
    const stageAvg = [
      { key: "lead", label: "Lead", avg: reportsAvg(perStage.lead), n: perStage.lead.length, color: "#3152E4" },
      { key: "negociacao", label: "Em negociação", avg: reportsAvg(perStage.negociacao), n: perStage.negociacao.length, color: "#D97706" },
    ];
    const cycles = fechados.map((r) => { const at = closedAt(r.c); return at ? Math.max(0, (new Date(at) - new Date(r.c.createdAt)) / 864e5) : null; }).filter((x) => x != null);
    const cycleAvg = reportsAvg(cycles);

    /* 3. motivos de perda */
    const lossMap = {};
    perdidos.forEach((r) => {
      const k = r.c.motivoPerda || "";
      if (!lossMap[k]) lossMap[k] = { key: k || "sem", label: k ? (motivoLabel(settings, k) || k) : "Sem motivo informado", n: 0, valor: 0 };
      lossMap[k].n += 1; lossMap[k].valor += r.valor;
    });
    const losses = Object.values(lossMap).sort((a, b) => b.n - a.n);

    /* 4. origens */
    const origMap = {};
    rows.forEach((r) => {
      const k = r.c.origem || "";
      if (!origMap[k]) origMap[k] = { key: k || "sem", label: k ? (origemLabel(settings, k) || k) : "Não informada", n: 0, fechados: 0, perdidos: 0, valor: 0 };
      origMap[k].n += 1;
      if (r.c.status === "fechado") { origMap[k].fechados += 1; origMap[k].valor += r.valor; }
      if (r.c.status === "perdido") origMap[k].perdidos += 1;
    });
    const origins = Object.values(origMap).sort((a, b) => b.n - a.n);

    /* 5. vendedores */
    const vendedores = (settings && settings.vendedores) || [];
    const sellerRows = vendedores.map((v) => ({ id: v.id, nome: v.nome, meta: Number(v.metaMensal) || 0, n: 0, abertos: 0, fechados: 0, perdidos: 0, valor: 0, valorMes: 0 }));
    const semResp = { id: "", nome: "Sem responsável", meta: 0, n: 0, abertos: 0, fechados: 0, perdidos: 0, valor: 0, valorMes: 0 };
    rows.forEach((r) => {
      const row = sellerRows.find((s) => s.id === r.c.responsavel) || semResp;
      row.n += 1;
      if (r.c.status === "lead" || r.c.status === "negociacao") row.abertos += 1;
      if (r.c.status === "perdido") row.perdidos += 1;
      if (r.c.status === "fechado") {
        row.fechados += 1; row.valor += r.valor;
        const at = closedAt(r.c);
        if (at && isSameMonth(at)) row.valorMes += r.valor;
      }
    });
    const sellers = semResp.n > 0 ? [...sellerRows, semResp] : sellerRows;

    /* 6. prioridade da carteira em aberto */
    const scored = abertos.map((r) => ({ ...r, s: scoreClient(settings, r.mod, r.c) })).sort((a, b) => b.s.points - a.s.points);
    const dist = { alta: 0, media: 0, baixa: 0 };
    scored.forEach((x) => { dist[x.s.level] = (dist[x.s.level] || 0) + 1; });

    return { total, fechados, perdidos, abertos, steps, stageAvg, cycleAvg, cycles, losses, origins, sellers, scored, dist,
      valorFechado: fechados.reduce((s, r) => s + r.valor, 0), valorPerdido: perdidos.reduce((s, r) => s + r.valor, 0) };
  }, [rows, settings]);

  const canOpen = (r) => r.mod.id === mod.id;
  const periodLabel = (REPORTS_PERIODS.find((p) => p.key === period) || REPORTS_PERIODS[0]).label.toLowerCase();
  const maxStageAvg = Math.max(0, ...data.stageAvg.map((s) => s.avg || 0));
  const maxLoss = Math.max(0, ...data.losses.map((l) => l.n));
  const maxOrig = Math.max(0, ...data.origins.map((o) => o.n));
  const SCORE_ORDER = ["alta", "media", "baixa"];

  return (
    <div className="space-y-5">
      <div className="flex flex-wrap items-center gap-2">
        <span className="mr-1 hidden items-center gap-1 text-xs font-medium text-slate-400 sm:inline-flex"><I.Calendar size={13} /> Período</span>
        {REPORTS_PERIODS.map((p) => <ReportsChip key={p.key} active={period === p.key} onClick={() => setPeriod(p.key)}>{p.label}</ReportsChip>)}
        {allModules && allModules.length > 1 && (
          <label className="ml-1 inline-flex cursor-pointer select-none items-center gap-2 rounded-full border border-slate-200 bg-white px-3 py-1.5 text-xs font-semibold text-slate-600">
            <span className={"relative inline-flex h-4 w-7 items-center rounded-full transition " + (allMods ? "bg-brand" : "bg-slate-300")}>
              <span className={"absolute h-3 w-3 rounded-full bg-white shadow transition " + (allMods ? "left-3.5" : "left-0.5")} />
            </span>
            <input type="checkbox" className="sr-only" checked={allMods} onChange={(e) => setAllMods(e.target.checked)} />
            Todos os módulos
          </label>
        )}
        <span className="ml-auto text-xs text-slate-500">
          <b className="text-ink tnum">{data.total}</b> {data.total === 1 ? "cliente" : "clientes"} na análise · {allMods && allModules && allModules.length > 1 ? "todos os módulos" : mod.nome} · cadastrados em {periodLabel === "tudo" ? "qualquer data" : periodLabel}
        </span>
      </div>

      {data.total === 0 ? (
        <Card>
          <EmptyState icon={I.BarChart} title="Sem dados no período" text="Nenhum cliente foi cadastrado nesse intervalo. Experimente um período maior ou ligue “Todos os módulos”."
            action={<button onClick={() => setPeriod("tudo")} className={btn.secondary}>Ver tudo</button>} />
        </Card>
      ) : (
        <>
          <div className="grid grid-cols-1 gap-5 lg:grid-cols-3">
            <Card className="lg:col-span-2">
              <CardHeader title="Conversão por etapa" icon={I.Trend} subtitle="De cada 100 clientes cadastrados, quantos avançaram e quantos fecharam" />
              <div className="px-5 pb-5 pt-4">
                <div className="space-y-3">

                    <div key={s.key}>
                      {i > 0 && (
                        <div className="mb-1 flex items-center gap-1 pl-1 text-[11px] text-slate-400">

                  <span><span className="mr-1 inline-block h-2 w-2 rounded-full" style={{ background: "#DC2626" }} />Perdidos: <b className="text-ink tnum">{data.perdidos.length}</b> ({reportsPct(data.perdidos.length, data.total)}%)</span>
                  <span>Em aberto: <b className="text-ink tnum">{data.abertos.length}</b></span>

/* ------------------------------ Proposta comercial ------------------------ */
/* Gera uma proposta a partir da ficha do cliente: prévia na tela (iframe com o
   mesmo HTML que vai para a impressão), impressão/PDF e cópia de um resumo. */
const PROPOSAL_INCLUDE = [
  { key: "todos", label: "Todos os itens" },
  { key: "interesse", label: "Só de interesse" },
  { key: "contratado", label: "Só contratados" },
];

function proposalEsc(s) {
  return String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}
function proposalNl(s) { return proposalEsc(s).replace(/\n/g, "<br>"); }

/* Detalhes de um item (campos que não são título, status nem valor). */
function proposalItemDetails(mod, item) {
  const titleField = mod.fields.find((f) => f.fromOptions) || mod.fields.find((f) => f.type === "text");
  return mod.fields
    .filter((f) => f.type !== "status" && f.type !== "currency" && (!titleField || f.id !== titleField.id))
    .map((f) => {
      const v = item[f.id];
      if (v === "" || v === undefined || v === null || (f.type === "number" && !v)) return null;
      return f.label.replace(/\s*\(%.*\)/, "") + ": " + (/%/.test(f.label) ? v + "%" : v);
    })
    .filter(Boolean)
    .join(" · ");
}

/* HTML independente da proposta (usado na prévia e na impressão). */
function proposalBuildHtml(p) {
  const logoUrl = new URL("assets/logo.png", window.location.href).href;
  const rows = p.items.map((it) => {
    const det = proposalItemDetails(p.mod, it);
    return '<tr><td><div class="it">' + proposalEsc(itemTitle(p.mod, it)) + "</div>" + (det ? '<div class="det">' + proposalEsc(det) + "</div>" : "") + "</td>" +
      '<td class="num">' + proposalEsc(BRL(itemValue(p.mod, it))) + "</td></tr>";
  }).join("");
  const emptyRow = '<tr><td colspan="2" class="empty">Nenhum ' + proposalEsc(p.mod.itemLabel.toLowerCase()) + " selecionado para esta proposta.</td></tr>";
  const totals =
    '<tr class="sub"><td>Subtotal</td><td class="num">' + proposalEsc(BRL(p.subtotal)) + "</td></tr>" +
    (p.desconto > 0 ? '<tr class="sub"><td>Desconto (' + proposalEsc(p.desconto) + '%)</td><td class="num">− ' + proposalEsc(BRL(p.descontoValor)) + "</td></tr>" : "") +
    '<tr class="tot"><td>Total</td><td class="num">' + proposalEsc(BRL(p.total)) + "</td></tr>";
  const printScript = p.autoPrint ? "<script>window.addEventListener('load',function(){setTimeout(function(){window.print();},350);});<\/script>" : "";
  return '<!DOCTYPE html><html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">' +
    "<title>Proposta " + proposalEsc(p.numero) + " · " + proposalEsc(p.client.nome) + "</title>" +
    "<style>" +
    "@page{size:A4;margin:16mm 16mm 18mm}" +
    "*{box-sizing:border-box}html,body{margin:0;background:#fff}" +
    "body{font-family:Inter,-apple-system,'Segoe UI',Roboto,system-ui,sans-serif;color:#1A1A2E;font-size:13px;line-height:1.5;padding:28px 32px}" +
    "@media print{body{padding:0}}" +
    ".head{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;padding-bottom:16px;border-bottom:3px solid #3152E4}" +
    ".brand{display:flex;align-items:center;gap:10px}.brand img{height:30px}.brand .txt{font-weight:800;font-size:22px;letter-spacing:-.02em;text-transform:lowercase}" +
    ".brand .tag{font-size:10px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:#3152E4;background:#EFF4FF;border-radius:6px;padding:2px 6px}" +
    ".meta{text-align:right}.meta h1{margin:0;font-size:18px;letter-spacing:-.01em}.meta div{font-size:11.5px;color:#64748b}.meta b{color:#1A1A2E}" +
    ".grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin:18px 0}" +
    ".box{border:1px solid #e2e8f0;border-radius:12px;padding:12px 14px}.box h3{margin:0 0 6px;font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:#64748b}" +
    ".box div{font-size:13px}.box .nm{font-weight:700;font-size:14px}" +
    "p.msg{white-space:normal;margin:0 0 16px;font-size:13.5px}" +
    "table{width:100%;border-collapse:collapse;margin:6px 0 16px}th{text-align:left;font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:#64748b;padding:8px 10px;border-bottom:1px solid #e2e8f0;background:#f8fafc}" +
    "td{padding:9px 10px;border-bottom:1px solid #f1f5f9;vertical-align:top}td.num,th.num{text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}" +
    ".it{font-weight:600}.det{font-size:11.5px;color:#64748b;margin-top:2px}td.empty{color:#94a3b8;text-align:center;padding:18px}" +
    "tr.sub td{color:#475569;border-bottom:none;padding-top:6px;padding-bottom:4px}tr.tot td{font-weight:800;font-size:15px;border-top:2px solid #1A1A2E;border-bottom:none;padding-top:10px}" +
    ".cond{background:#f8fafc;border-radius:12px;padding:12px 14px;font-size:12px;color:#475569}.cond h3{margin:0 0 4px;font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:#64748b}" +
    ".sign{display:flex;justify-content:space-between;align-items:flex-end;gap:24px;margin-top:34px}.sign .line{width:260px;border-top:1px solid #1A1A2E;padding-top:6px;font-size:12px}.sign .line b{display:block;font-size:13px}" +
    ".foot{margin-top:26px;padding-top:10px;border-top:1px solid #e2e8f0;font-size:10.5px;color:#94a3b8;display:flex;justify-content:space-between}" +
    "</style></head><body>" +
    '<div class="head"><div class="brand"><img src="' + proposalEsc(logoUrl) + '" alt="Próspera" onerror="this.style.display=\'none\';this.nextSibling.style.display=\'inline\'"><span class="txt" style="display:none">próspera</span><span class="tag">' + proposalEsc(p.mod.nome) + "</span></div>" +
    '<div class="meta"><h1>Proposta comercial</h1><div>Nº <b>' + proposalEsc(p.numero) + "</b></div><div>Emitida em <b>" + proposalEsc(p.dataEmissao) + "</b></div><div>Válida por <b>" + proposalEsc(p.validade) + " dias</b> (até " + proposalEsc(p.dataValidade) + ")</div></div></div>" +
    '<div class="grid"><div class="box"><h3>Preparada para</h3><div class="nm">' + proposalEsc(p.client.nome) + "</div>" +
    (p.client.empresa ? "<div>" + proposalEsc(p.client.empresa) + "</div>" : "") +
    (p.client.telefone ? "<div>" + proposalEsc(p.client.telefone) + "</div>" : "") +
    (p.client.email ? "<div>" + proposalEsc(p.client.email) + "</div>" : "") + "</div>" +
    '<div class="box"><h3>Seu contato na Próspera</h3><div class="nm">' + proposalEsc(p.vendedor || "Equipe Próspera") + "</div><div>Próspera Benefícios</div><div>" + proposalEsc(p.mod.itemLabelPlural) + "</div></div></div>" +
    (p.mensagem.trim() ? '<p class="msg">' + proposalNl(p.mensagem.trim()) + "</p>" : "") +
    "<table><thead><tr><th>" + proposalEsc(p.mod.itemLabel) + '</th><th class="num">Valor</th></tr></thead><tbody>' + (rows || emptyRow) + totals + "</tbody></table>" +
    (p.condicoes.trim() ? '<div class="cond"><h3>Condições comerciais</h3>' + proposalNl(p.condicoes.trim()) + "</div>" : "") +
    '<div class="sign"><div class="line"><b>' + proposalEsc(p.vendedor || "Equipe Próspera") + "</b>Próspera Benefícios</div><div class=\"line\"><b>" + proposalEsc(p.client.nome) + "</b>De acordo</div></div>" +
    '<div class="foot"><span>Próspera Benefícios · proposta nº ' + proposalEsc(p.numero) + "</span><span>Gerada pelo Próspera CRM em " + proposalEsc(p.dataEmissao) + "</span></div>" +
    printScript + "</body></html>";
}

function proposalPlainText(p) {
  const lines = [
    "Proposta comercial nº " + p.numero + " — Próspera Benefícios",
    "Cliente: " + p.client.nome + (p.client.empresa ? " (" + p.client.empresa + ")" : ""),
    "Emitida em " + p.dataEmissao + " · válida por " + p.validade + " dias (até " + p.dataValidade + ")",
    "",
  ];
  if (p.mensagem.trim()) lines.push(p.mensagem.trim(), "");
  lines.push(p.mod.itemLabelPlural + ":");
  if (p.items.length === 0) lines.push("- (nenhum item selecionado)");
  p.items.forEach((it) => {
    const det = proposalItemDetails(p.mod, it);
    lines.push("- " + itemTitle(p.mod, it) + (det ? " (" + det + ")" : "") + " — " + BRL(itemValue(p.mod, it)));
  });
  lines.push("", "Subtotal: " + BRL(p.subtotal));
  if (p.desconto > 0) lines.push("Desconto (" + p.desconto + "%): -" + BRL(p.descontoValor));
  lines.push("Total: " + BRL(p.total), "");
  if (p.condicoes.trim()) lines.push("Condições: " + p.condicoes.trim(), "");
  lines.push(p.vendedor ? p.vendedor + " · Próspera Benefícios" : "Equipe Próspera Benefícios");
  return lines.join("\n");
}

function proposalCopyText(text) {
  if (navigator.clipboard && navigator.clipboard.writeText) return navigator.clipboard.writeText(text);
  return new Promise((resolve, reject) => {
    try {
      const ta = document.createElement("textarea");
      ta.value = text; ta.setAttribute("readonly", ""); ta.style.position = "fixed"; ta.style.opacity = "0";
      document.body.appendChild(ta); ta.select(); document.execCommand("copy"); ta.remove(); resolve();
    } catch (e) { reject(e); }
  });
}

function ProposalModal({ mod, client, settings, onClose, onGenerated }) {
  const st = settings || {};
  const hasStatus = mod.fields.some((f) => f.type === "status");
  const first = (client.nome || "").trim().split(" ")[0] || "cliente";
  const [numero] = useState(() => todayISO().replace(/-/g, "") + "-" + uid().slice(0, 4).toUpperCase());
  const [validade, setValidade] = useState(15);
  const [incluir, setIncluir] = useState("todos");
  const [desconto, setDesconto] = useState(0);
  const [vendedor, setVendedor] = useState(() => vendedorNome(st, client.responsavel) || vendedorNome(st, st.usuarioAtual) || "");
  const [mensagem, setMensagem] = useState(() =>
    "Olá " + first + ", obrigado pelo interesse na Próspera. Preparamos esta proposta de " + mod.itemLabelPlural.toLowerCase() +
    " pensando nas necessidades da " + (client.empresa || "sua empresa") + ". Fico à disposição para ajustar o que for preciso.");
  const [condicoes, setCondicoes] = useState(
    "Validade conforme indicada no cabeçalho. Valores sujeitos a análise cadastral e às condições contratuais vigentes.\nPagamento e faturamento conforme contrato. Esta proposta não substitui o contrato definitivo.");
  const [copied, setCopied] = useState(false);
  const [popupBlocked, setPopupBlocked] = useState(false);

  const items = useMemo(() => {
    const all = client.items || [];
    if (!hasStatus || incluir === "todos") return all;
    return all.filter((it) => (it.status || "interesse") === incluir);
  }, [client.items, incluir, hasStatus]);

  const validadeNum = Math.max(1, Math.min(365, Number(validade) || 15));
  const descontoNum = Math.max(0, Math.min(100, Number(desconto) || 0));
  const subtotal = items.reduce((s, it) => s + itemValue(mod, it), 0);
  const descontoValor = Math.round(subtotal * descontoNum) / 100;
  const total = Math.max(0, subtotal - descontoValor);

  const data = {
    mod, client, items, numero, vendedor, mensagem, condicoes,
    validade: validadeNum, desconto: descontoNum, subtotal, descontoValor, total,
    dataEmissao: fmtDate(todayISO()), dataValidade: fmtDate(daysFromNow(validadeNum)),
  };
  const previewHtml = useMemo(() => proposalBuildHtml({ ...data, autoPrint: false }),
    [items, numero, vendedor, mensagem, condicoes, validadeNum, descontoNum, subtotal, total, client, mod]);

  const print = () => {
    const w = window.open("", "_blank");
    if (!w) { setPopupBlocked(true); return; }
    setPopupBlocked(false);
    w.document.open(); w.document.write(proposalBuildHtml({ ...data, autoPrint: true })); w.document.close();
    onGenerated && onGenerated({ numero, validade: validadeNum });
  };
  const copy = () => {
    proposalCopyText(proposalPlainText(data)).then(() => { setCopied(true); setTimeout(() => setCopied(false), 2000); }).catch(() => {});
  };

  const label = "mb-1 block text-[11px] font-semibold uppercase tracking-wide text-slate-500";
  const smallInput = inputCls + " py-2 text-sm";

  return (
    <Modal title="Proposta comercial" subtitle={client.nome + (client.empresa ? " · " + client.empresa : "")} icon={I.FileText} onClose={onClose} width="max-w-5xl"
      footer={
        <div className="flex w-full flex-col-reverse gap-2 sm:flex-row sm:items-center sm:justify-between">
          <div className="text-[11px] text-slate-400">Nº {numero} · {items.length} {items.length === 1 ? mod.itemLabel.toLowerCase() : mod.itemLabelPlural.toLowerCase()} · total <b className="text-slate-600 tnum">{BRL(total)}</b></div>
          <div className="flex items-center justify-end gap-2.5">
            <button type="button" onClick={onClose} className={btn.ghost}>Fechar</button>
            <button type="button" onClick={copy} className={btn.secondary}>{copied ? <><I.CheckSimple size={16} /> Copiado!</> : <><I.Copy size={16} /> Copiar resumo</>}</button>
            <button type="button" onClick={print} className={btn.primary}><I.Printer size={16} /> Imprimir / salvar PDF</button>
          </div>
        </div>
      }>
      <div className="grid grid-cols-1 gap-5 lg:grid-cols-[300px_1fr]">
        <div className="space-y-4">
          <div className="rounded-xl border border-slate-200 bg-slate-50 p-4">
            <div className="mb-3 text-sm font-semibold text-ink">Opções da proposta</div>
            <div className="grid grid-cols-2 gap-3">
              <label className="block"><span className={label}>Validade (dias)</span>
                <input type="number" min="1" max="365" value={validade} onChange={(e) => setValidade(e.target.value === "" ? "" : Number(e.target.value))} className={smallInput} />
              </label>
              <label className="block"><span className={label}>Desconto</span>
                <div className="relative">
                  <input type="number" min="0" max="100" step="0.5" value={desconto} onChange={(e) => setDesconto(e.target.value === "" ? "" : Number(e.target.value))} className={smallInput + " pr-8"} placeholder="0" />
                  <span className="pointer-events-none absolute right-3 top-1/2 -translate-y-1/2 text-xs font-semibold text-slate-400">%</span>
                </div>
              </label>
            </div>
            {hasStatus && (
              <div className="mt-3">
                <span className={label}>Quais {mod.itemLabelPlural.toLowerCase()} incluir</span>
                <div className="grid grid-cols-3 gap-1.5">
                  {PROPOSAL_INCLUDE.map((o) => (
                    <button key={o.key} type="button" onClick={() => setIncluir(o.key)}
                      className={"rounded-lg border px-2 py-1.5 text-[11px] font-semibold transition " + (incluir === o.key ? "border-brand bg-brand-50 text-brand" : "border-slate-200 bg-white text-slate-600 hover:border-slate-300")}>
                      {o.label}
                    </button>
                  ))}
                </div>
              </div>
            )}
            <label className="mt-3 block"><span className={label}>Vendedor (assina a proposta)</span>
              <input value={vendedor} onChange={(e) => setVendedor(e.target.value)} className={smallInput} placeholder="Nome de quem envia" />
            </label>
          </div>

          <label className="block"><span className={label}>Mensagem de abertura</span>
            <textarea value={mensagem} onChange={(e) => setMensagem(e.target.value)} className={inputCls + " min-h-[110px] resize-y text-sm"} />
          </label>
          <label className="block"><span className={label}>Condições comerciais</span>
            <textarea value={condicoes} onChange={(e) => setCondicoes(e.target.value)} className={inputCls + " min-h-[96px] resize-y text-sm"} />
          </label>

          {items.length === 0 && (
            <div className="flex items-start gap-2 rounded-xl border border-amber-200 bg-amber-50 p-3 text-xs text-amber-900">
              <I.Alert size={15} className="mt-0.5 shrink-0" /><span>Nenhum {mod.itemLabel.toLowerCase()} entra nesta proposta. Adicione itens na aba "{mod.itemLabelPlural.split(" ")[0]}" da ficha ou mude o filtro acima.</span>
            </div>
          )}
          {popupBlocked && (
            <div className="flex items-start gap-2 rounded-xl border border-red-200 bg-red-50 p-3 text-xs text-red-800">
              <I.Alert size={15} className="mt-0.5 shrink-0" /><span>O navegador bloqueou a janela de impressão. Permita pop-ups para este site e tente de novo.</span>
            </div>
          )}
          <p className="text-[11px] leading-relaxed text-slate-400">Na janela de impressão, escolha "Salvar como PDF" para gerar o arquivo e enviar ao cliente.</p>
        </div>

        <div className="min-w-0">
          <div className="mb-2 flex items-center justify-between text-xs text-slate-500">
            <span className="inline-flex items-center gap-1.5"><I.Eye size={14} /> Prévia (é assim que vai sair no papel)</span>
            <span className="hidden sm:inline">Formato A4</span>
          </div>
          <div className="overflow-hidden rounded-xl border border-slate-200 bg-slate-200/60 p-2 sm:p-4">
            <iframe title="Prévia da proposta" srcDoc={previewHtml} sandbox="allow-same-origin" className="h-[62vh] w-full rounded-lg bg-white shadow-card lg:h-[64vh]" />
          </div>
        </div>
      </div>
    </Modal>
  );
}
