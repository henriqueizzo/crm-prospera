              </div>
              <div className="space-y-2">
                {client.items.length === 0 && <p className="rounded-xl border border-dashed border-slate-200 px-3 py-5 text-center text-xs text-slate-400">Nenhum {mod.itemLabel.toLowerCase()} registrado. Use o formulário abaixo.</p>}
                {client.items.map((it) => <ItemCard key={it.id} mod={mod} item={it} onToggleStatus={() => toggleItemStatus(it.id)} onRemove={() => removeItem(it.id)} />)}
              </div>
              <div className="rounded-2xl border border-slate-200 bg-slate-50 p-4">
                <div className="mb-3 text-sm font-semibold text-ink">Adicionar {mod.itemLabel.toLowerCase()}</div>
                <div className="grid grid-cols-2 gap-3">
                  {mod.fields.map((f) => (
                    <div key={f.id} className={(f.type === "text" || f.fromOptions) ? "col-span-2" : "col-span-1"}>
                      <FieldInput mod={mod} field={f} value={draft[f.id]} onChange={(v) => setDraftField(f.id, v)} small />
                    </div>
                  ))}
                </div>
                <button onClick={addItem} className={btn.primary + " mt-3 w-full"}><I.Plus size={16} /> Adicionar {mod.itemLabel.toLowerCase()}</button>
              </div>
            </div>
          )}

          {tab === "tarefas" && (
            <div className="space-y-5">
              <div className="rounded-2xl border border-slate-200 bg-slate-50 p-4">
                <div className="mb-3 text-sm font-semibold text-ink">Novo follow-up</div>
                <div className="flex flex-col gap-2 sm:flex-row">
                  <input placeholder="Ex.: Ligar para confirmar proposta" value={taskDraft.titulo}
                    onChange={(e) => setTaskDraft((d) => ({ ...d, titulo: e.target.value }))}
                    onKeyDown={(e) => e.key === "Enter" && addTask()} className={inputCls + " flex-1"} aria-label="Título da tarefa" />
                  <input type="date" value={taskDraft.data} onChange={(e) => setTaskDraft((d) => ({ ...d, data: e.target.value }))} className={inputCls + " sm:w-44"} aria-label="Data da tarefa" />
                  <button onClick={addTask} disabled={!taskDraft.titulo.trim()} className={btn.primary}><I.Plus size={16} /> Adicionar</button>
                </div>
              </div>
              <div className="space-y-2">
                {sortedTasks.length === 0 && <p className="rounded-xl border border-dashed border-slate-200 px-3 py-5 text-center text-xs text-slate-400">Nenhum lembrete agendado para este cliente.</p>}
                {sortedTasks.map((t) => {
                  const late = isOverdue(t.data) && !t.feito;
                  return (
                    <div key={t.id} className={"flex items-center gap-3 rounded-xl border px-3.5 py-2.5 transition " + (t.feito ? "border-slate-100 bg-slate-50/60" : late ? "border-red-200 bg-red-50/40" : "border-slate-200 bg-white")}>
                      <button onClick={() => toggleTask(t.id)} aria-label={t.feito ? "Reabrir tarefa" : "Concluir tarefa"}
                        className={"flex h-5 w-5 shrink-0 items-center justify-center rounded-full border-2 transition " + (t.feito ? "border-emerald-500 bg-emerald-500 text-white" : "border-slate-300 text-transparent hover:border-emerald-500")}>
                        <I.CheckSimple size={12} />
                      </button>
                      <div className="min-w-0 flex-1">
                        <div className={"truncate text-sm " + (t.feito ? "text-slate-400 line-through" : "font-medium text-ink")}>{t.titulo}</div>
                        {t.data && <div className={"flex items-center gap-1 text-xs " + (late ? "font-semibold text-red-600" : "text-slate-500")}><I.Calendar size={12} /> {fmtDate(t.data)}{late ? " · atrasado" : daysUntil(t.data) === 0 && !t.feito ? " · hoje" : ""}</div>}
                      </div>
                      <IconBtn title="Remover tarefa" onClick={() => removeTask(t.id)} danger className="h-8 w-8"><I.X size={15} /></IconBtn>
                    </div>
                  );
                })}
              </div>
            </div>
          )}
        </div>

        <div className="flex items-center justify-between border-t border-slate-100 px-6 py-3 text-[11px] text-slate-400">
          <span>Atualizado {relTime(client.updatedAt)}</span>
          <span className="hidden sm:inline-flex items-center gap-1.5"><Kbd>Esc</Kbd> fecha</span>
        </div>
      </div>
    </div>
  );
}

function ItemCard({ mod, item, onToggleStatus, onRemove }) {
  const hasStatus = mod.fields.some((f) => f.type === "status");
  const detailFields = mod.fields.filter((f) => f.type !== "status" && !f.fromOptions && f.type !== "currency");
  const currencyField = mod.fields.find((f) => f.type === "currency");
  const done = item.status === "contratado";
  return (
    <div className={"rounded-xl border px-4 py-3 transition " + (done ? "border-emerald-100 bg-emerald-50/40" : "border-slate-200 bg-white")}>
      <div className="flex items-center gap-3">
        <div className="min-w-0 flex-1">
          <div className="truncate text-sm font-semibold text-ink">{itemTitle(mod, item)}</div>
          {hasStatus && (
            <button onClick={onToggleStatus} title="Clique para alternar"
              className={"mt-1 inline-flex items-center gap-1 rounded-full px-2 py-0.5 text-[11px] font-semibold transition hover:brightness-95 " + (done ? "bg-emerald-100 text-emerald-800" : "bg-amber-50 text-amber-800")}>
              <span className={"h-1.5 w-1.5 rounded-full " + (done ? "bg-emerald-600" : "bg-amber-500")} />{done ? "Contratado" : "De interesse"}
            </button>
          )}
        </div>
        {currencyField && <div className="text-sm font-semibold text-ink tnum">{BRL(item[currencyField.id])}</div>}
        <IconBtn title={"Remover " + mod.itemLabel.toLowerCase()} onClick={onRemove} danger className="h-8 w-8"><I.X size={15} /></IconBtn>
      </div>
      {detailFields.length > 0 && (
        <div className="mt-2 flex flex-wrap gap-1.5">
          {detailFields.map((f) => {
            const v = item[f.id];
            if (v === "" || v === undefined || v === null || (f.type === "number" && !v)) return null;
            return <span key={f.id} className="rounded-md bg-slate-100 px-2 py-0.5 text-[11px] text-slate-600"><span className="text-slate-400">{f.label}:</span> <span className="font-medium">{/%/.test(f.label) ? v + "%" : v}</span></span>;
          })}
        </div>
      )}
    </div>
  );
}

function FieldInput({ mod, field, value, onChange, small }) {
  const cls = inputCls + (small ? " py-2" : "");
  const labelCls = small ? "mb-1 block text-[11px] font-semibold uppercase tracking-wide text-slate-500" : "mb-1.5 block text-sm font-medium text-slate-700";
  if (field.fromOptions && mod.options && mod.options.length) {
    return (
      <label className="block"><span className={labelCls}>{field.label}</span>
        <select value={value} onChange={(e) => onChange(e.target.value)} className={cls}>
          {mod.options.map((o) => <option key={o} value={o}>{o}</option>)}
        </select>
      </label>
    );
  }
  if (field.type === "status") {
    return (
      <label className="block"><span className={labelCls}>{field.label}</span>
        <select value={value} onChange={(e) => onChange(e.target.value)} className={cls}>
          {ITEM_STATUS.map((s) => <option key={s.key} value={s.key}>{s.label}</option>)}
        </select>
      </label>
    );
  }
  if (field.type === "number" || field.type === "currency") {
    const isCur = field.type === "currency", isPct = /%/.test(field.label);
    return (
      <label className="block"><span className={labelCls}>{field.label.replace(/\s*\(%.*\)/, "")}</span>
        <div className="relative">
          {isCur && <span className="pointer-events-none absolute left-3 top-1/2 -translate-y-1/2 text-xs font-semibold text-slate-400">R$</span>}
          <input type="number" min="0" step={isCur ? "0.01" : "any"} value={value} onChange={(e) => onChange(e.target.value === "" ? "" : Number(e.target.value))}
            className={cls + (isCur ? " pl-9" : "") + (isPct ? " pr-8" : "")} placeholder="0" />
          {isPct && <span className="pointer-events-none absolute right-3 top-1/2 -translate-y-1/2 text-xs font-semibold text-slate-400">%</span>}
        </div>
      </label>
    );
  }
  return (
    <label className="block"><span className={labelCls}>{field.label}</span>
      <input type="text" value={value} onChange={(e) => onChange(e.target.value)} className={cls} placeholder={field.label} />
    </label>
  );
}

function ContactRow({ icon: IconC, label, value }) {
  return (
    <div className="flex items-center gap-3 rounded-xl border border-slate-200 px-3.5 py-2.5">
      <span className="shrink-0 text-slate-400"><IconC size={16} /></span>
      <div className="min-w-0">
        <div className="text-[11px] font-semibold uppercase tracking-wide text-slate-400">{label}</div>
        <div className={"truncate text-sm " + (value ? "text-ink" : "text-slate-300")}>{value || "não informado"}</div>
      </div>
    </div>
  );
}

/* ------------------------------- Client form ------------------------------ */
function ClientForm({ mod, initial, onClose, onSave }) {
  const [form, setForm] = useState(initial || { nome: "", telefone: "", email: "", empresa: "", status: "lead", obs: "" });
  const [errors, setErrors] = useState({});
  const nameRef = useRef(null);
  useEffect(() => { nameRef.current && nameRef.current.focus(); }, []);

  const set = (k, transform) => (e) => { const v = transform ? transform(e.target.value) : e.target.value; setForm((f) => ({ ...f, [k]: v })); if (errors[k]) setErrors((er) => ({ ...er, [k]: null })); };
  const submit = () => {
    const er = {};
    if (!form.nome.trim()) er.nome = "Informe o nome do cliente.";
    if (!isEmail(form.email)) er.email = "Digite um e-mail válido (ex.: nome@empresa.com).";
    const digits = onlyDigits(form.telefone);
    if (digits && digits.length < 10) er.telefone = "Telefone incompleto. Use DDD + número.";
    if (Object.keys(er).length) { setErrors(er); return; }
    onSave({ ...form, nome: form.nome.trim(), email: (form.email || "").trim(), empresa: (form.empresa || "").trim() });
  };
  const onKey = (e) => { if (e.key === "Enter" && !["TEXTAREA", "BUTTON"].includes(e.target.tagName)) { e.preventDefault(); submit(); } };

  return (
    <div className="fixed inset-0 z-50 flex items-end justify-center p-0 sm:items-center sm:p-4" role="dialog" aria-modal="true" aria-label={initial ? "Editar cliente" : "Novo cliente"}>
      <div className="absolute inset-0 bg-ink/40 backdrop-blur-[2px] anim-fade" onClick={onClose} />
      <div className="relative w-full max-w-xl rounded-t-3xl bg-white shadow-pop anim-pop sm:rounded-2xl" onKeyDown={onKey}>
        <div className="flex items-center justify-between border-b border-slate-100 px-6 py-4">
          <div>
            <h2 className="text-lg font-bold text-ink">{initial ? "Editar cliente" : "Novo cliente"}</h2>
            <p className="text-xs text-slate-500">Módulo {mod.nome}</p>
          </div>
          <IconBtn title="Fechar (Esc)" onClick={onClose}><I.X size={20} /></IconBtn>
        </div>
        <div className="max-h-[70vh] overflow-y-auto px-6 py-5">
          <div className="grid grid-cols-1 gap-4 sm:grid-cols-2">
            <div className="sm:col-span-2">
              <Field label="Nome do contato" required error={errors.nome}>
                <input ref={nameRef} className={inputCls + (errors.nome ? inputErrCls : "")} value={form.nome} onChange={set("nome")} placeholder="Ex.: Mariana Costa" autoComplete="off" />
              </Field>
            </div>
            <div className="sm:col-span-2">
              <Field label="Empresa"><input className={inputCls} value={form.empresa} onChange={set("empresa")} placeholder="Ex.: TechLog Soluções" autoComplete="off" /></Field>
            </div>
            <Field label="Telefone / WhatsApp" error={errors.telefone}>
              <input className={inputCls + (errors.telefone ? inputErrCls : "")} value={form.telefone} onChange={set("telefone", maskPhone)} placeholder="(11) 99999-9999" inputMode="tel" autoComplete="off" />
            </Field>
            <Field label="E-mail" error={errors.email}>
              <input className={inputCls + (errors.email ? inputErrCls : "")} value={form.email} onChange={set("email")} placeholder="nome@empresa.com" inputMode="email" autoComplete="off" />
            </Field>
            <div className="sm:col-span-2">
              <span className="mb-1.5 block text-sm font-medium text-slate-700">Etapa no funil</span>
              <div className="grid grid-cols-2 gap-1.5 sm:grid-cols-4">
                {STATUSES.map((s) => {
                  const active = form.status === s.key;
                  return (
                    <button type="button" key={s.key} onClick={() => setForm((f) => ({ ...f, status: s.key }))}
                      className={"inline-flex items-center justify-center gap-1.5 rounded-xl border px-2 py-2 text-xs font-semibold transition " + (active ? "border-transparent shadow-sm" : "border-slate-200 bg-white text-slate-600 hover:border-slate-300")}
                      style={active ? { background: s.soft, color: s.text, boxShadow: "inset 0 0 0 1px " + s.color + "55" } : undefined}>
                      <span className="h-1.5 w-1.5 rounded-full" style={{ background: s.color }} />{s.label}
                    </button>
                  );
                })}
              </div>
            </div>
            <div className="sm:col-span-2">
              <Field label="Observações" hint={"Os " + mod.itemLabelPlural.toLowerCase() + " são adicionados depois, dentro do card do cliente."}>
                <textarea className={inputCls + " min-h-[96px] resize-y"} value={form.obs} onChange={set("obs")} placeholder="Contexto, histórico, próximos passos…" />
              </Field>
            </div>
          </div>
        </div>
        <div className="flex items-center justify-end gap-2.5 border-t border-slate-100 px-6 py-4">
          <button type="button" onClick={onClose} className={btn.ghost}>Cancelar</button>
          <button type="button" onClick={submit} className={btn.primary}>{initial ? "Salvar alterações" : "Cadastrar cliente"}</button>
        </div>
      </div>
    </div>
  );
}

/* --------------------------- Module Manager ------------------------------- */
const MODULE_COLORS = ["#3152E4", "#7C3AED", "#0E7490", "#047857", "#D97706", "#DC2626", "#BE185D", "#0D9488"];

function Modal({ title, subtitle, icon: IconC, onClose, children, footer, width = "max-w-2xl" }) {
  return (
    <div className="fixed inset-0 z-50 flex items-end justify-center p-0 sm:items-center sm:p-4" role="dialog" aria-modal="true" aria-label={title}>
      <div className="absolute inset-0 bg-ink/40 backdrop-blur-[2px] anim-fade" onClick={onClose} />
      <div className={"relative flex max-h-[92vh] w-full flex-col rounded-t-3xl bg-white shadow-pop anim-pop sm:rounded-2xl " + width}>
        <div className="flex items-center justify-between border-b border-slate-100 px-6 py-4">
          <div className="flex items-center gap-3">
            {IconC && <span className="flex h-9 w-9 items-center justify-center rounded-xl bg-brand-50 text-brand"><IconC size={18} /></span>}
            <div><h2 className="text-lg font-bold text-ink">{title}</h2>{subtitle && <p className="text-xs text-slate-500">{subtitle}</p>}</div>
          </div>
          <IconBtn title="Fechar (Esc)" onClick={onClose}><I.X size={20} /></IconBtn>
        </div>
        <div className="flex-1 overflow-y-auto px-6 py-5">{children}</div>
        {footer && <div className="flex items-center justify-end gap-2.5 border-t border-slate-100 px-6 py-4">{footer}</div>}
      </div>
    </div>
  );
}

function ModuleManager({ modules, onClose, onAdd, onDelete }) {
  const [creating, setCreating] = useState(false);
  return (
    <Modal title={creating ? "Novo módulo de produto" : "Módulos de produto"} subtitle={creating ? "Defina o nome, a cor e os campos de cada item" : "Cada módulo tem sua própria carteira de clientes e campos"} icon={I.Grid} onClose={onClose}>
      {!creating ? (
        <>
          <div className="space-y-2">
            {modules.map((m) => {
              const MIcon = I[m.icon] || I.Grid;
              return (
                <div key={m.id} className="flex items-center gap-3 rounded-xl border border-slate-200 px-4 py-3">
                  <span className="flex h-10 w-10 items-center justify-center rounded-xl text-white" style={{ background: m.accent }}><MIcon size={18} /></span>
                  <div className="min-w-0 flex-1">
                    <div className="font-semibold text-ink">{m.nome}</div>
                    <div className="text-xs text-slate-500">{m.clients.length} cliente(s) · {m.fields.length} campo(s) por {m.itemLabel.toLowerCase()}{m.options.length ? " · " + m.options.length + " opções" : ""}</div>
                  </div>
                  {modules.length > 1 && <IconBtn title="Excluir módulo" onClick={() => onDelete(m.id)} danger><I.Trash size={18} /></IconBtn>}
                </div>
              );
            })}
          </div>
          <button onClick={() => setCreating(true)}
            className="mt-3 inline-flex w-full items-center justify-center gap-2 rounded-xl border-2 border-dashed border-brand/30 bg-brand-50/40 py-3 text-sm font-semibold text-brand transition hover:bg-brand-50">
            <I.Plus size={18} /> Criar novo módulo de produto
          </button>
        </>
      ) : (
        <ModuleBuilder onCancel={() => setCreating(false)} onCreate={onAdd} existingIds={modules.map((m) => m.id)} />
      )}
    </Modal>
  );
}

function ModuleBuilder({ onCancel, onCreate, existingIds }) {
  const [nome, setNome] = useState("");
  const [itemLabel, setItemLabel] = useState("Item");
  const [accent, setAccent] = useState(MODULE_COLORS[2]);
  const [icon, setIcon] = useState("Grid");
  const [options, setOptions] = useState("");
  const [fields, setFields] = useState([
    { id: "tipo", label: "Tipo", type: "text", fromOptions: true },
    { id: "status", label: "Status", type: "status" },
    { id: "valor", label: "Valor", type: "currency" },
  ]);
  const [err, setErr] = useState("");

  const addField = () => setFields((fs) => [...fs, { id: "campo" + (fs.length + 1), label: "", type: "text" }]);
  const updateField = (i, patch) => setFields((fs) => fs.map((f, idx) => idx === i ? { ...f, ...patch } : f));
  const removeField = (i) => setFields((fs) => fs.filter((_, idx) => idx !== i));

  const create = () => {
    if (!nome.trim()) { setErr("Dê um nome ao módulo."); return; }
    const validFields = fields.filter((f) => f.label.trim());
    if (validFields.length === 0) { setErr("Adicione ao menos um campo."); return; }
    let base = nome.trim().toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g, "").replace(/[^a-z0-9]+/g, "_").replace(/^_|_$/g, "");
    let id = base || "modulo"; let n = 1;
    while (existingIds.includes(id)) { id = base + "_" + (++n); }
    const finalFields = validFields.map((f, i) => ({
      id: (f.id && f.id !== "" ? f.id : "campo_" + i).toLowerCase().replace(/[^a-z0-9_]/g, "_"),
      label: f.label.trim(), type: f.type, fromOptions: !!f.fromOptions && f.type === "text",
    }));
    const opts = options.split("\n").map((o) => o.trim()).filter(Boolean);
    onCreate({ id, nome: nome.trim(), icon, accent, itemLabel: itemLabel.trim() || "Item", itemLabelPlural: (itemLabel.trim() || "Item") + "s", options: opts, fields: finalFields });
  };

  return (
    <div>
      <div className="grid grid-cols-1 gap-4 sm:grid-cols-2">
        <Field label="Nome do módulo" required><input className={inputCls} value={nome} onChange={(e) => setNome(e.target.value)} placeholder="Ex.: Crédito, Seguros, Energia" /></Field>
        <Field label="Como chamar cada item" hint="Ex.: Produto, Plano, Contrato"><input className={inputCls} value={itemLabel} onChange={(e) => setItemLabel(e.target.value)} /></Field>
      </div>

      <div className="mt-4 grid grid-cols-1 gap-4 sm:grid-cols-2">
        <div>
          <span className="mb-1.5 block text-sm font-medium text-slate-700">Cor</span>
          <div className="flex flex-wrap gap-2">
            {MODULE_COLORS.map((c) => (
              <button key={c} type="button" onClick={() => setAccent(c)} aria-label={"Cor " + c}
                className={"h-8 w-8 rounded-lg transition " + (accent === c ? "ring-2 ring-offset-2 ring-ink" : "hover:scale-105")} style={{ background: c }} />
            ))}
          </div>
        </div>
        <div>
          <span className="mb-1.5 block text-sm font-medium text-slate-700">Ícone</span>
          <div className="flex flex-wrap gap-2">
            {ICON_CHOICES.map((k) => { const Ic = I[k]; return (
              <button key={k} type="button" onClick={() => setIcon(k)} aria-label={"Ícone " + k}
                className={"flex h-8 w-8 items-center justify-center rounded-lg border transition " + (icon === k ? "border-transparent text-white" : "border-slate-200 bg-white text-slate-500 hover:border-slate-300")}
                style={icon === k ? { background: accent } : undefined}><Ic size={16} /></button>
            ); })}
          </div>
        </div>
      </div>

      <div className="mt-4">
        <Field label="Opções pré-definidas (uma por linha, opcional)" hint='Usadas no campo marcado como "lista".'>
          <textarea className={inputCls + " min-h-[72px] resize-y"} value={options} onChange={(e) => setOptions(e.target.value)} placeholder={"Empréstimo pessoal\nCapital de giro\nFinanciamento"} />
        </Field>
      </div>

      <div className="mt-5">
        <div className="mb-2 flex items-center justify-between">
          <span className="text-sm font-semibold text-slate-700">Campos por {(itemLabel || "item").toLowerCase()}</span>
          <button type="button" onClick={addField} className="inline-flex items-center gap-1 text-xs font-semibold text-brand hover:underline"><I.Plus size={14} /> Adicionar campo</button>
        </div>
        <div className="space-y-2">
          {fields.map((f, i) => (
            <div key={i} className="grid grid-cols-12 items-center gap-2 rounded-xl bg-slate-50 p-2">
              <input className={inputCls + " col-span-5 py-2 text-xs"} value={f.label} onChange={(e) => updateField(i, { label: e.target.value })} placeholder="Nome do campo" />
              <select className={inputCls + " col-span-4 py-2 text-xs"} value={f.type} onChange={(e) => updateField(i, { type: e.target.value })}>
                {FIELD_TYPES.map((t) => <option key={t.key} value={t.key}>{t.label}</option>)}
              </select>
              <label className="col-span-2 flex items-center gap-1 text-[11px] text-slate-600" title="Preencher a partir da lista de opções">
                <input type="checkbox" checked={!!f.fromOptions} disabled={f.type !== "text"} onChange={(e) => updateField(i, { fromOptions: e.target.checked })} /> lista
              </label>
              <button type="button" onClick={() => removeField(i)} className="col-span-1 flex justify-center text-slate-300 hover:text-red-500" aria-label="Remover campo"><I.X size={15} /></button>
            </div>
          ))}
        </div>
        <p className="mt-1.5 text-xs text-slate-400">Tipos: texto, número, valor (R$, soma no funil e no painel) e status (interesse/contratado). Marque "lista" para um campo de texto puxar das opções acima.</p>
      </div>

      {err && <p className="mt-3 flex items-center gap-1.5 text-sm font-medium text-red-600"><I.Alert size={15} /> {err}</p>}
      <div className="mt-5 flex justify-end gap-2.5">
        <button type="button" onClick={onCancel} className={btn.ghost}><I.ChevL size={16} /> Voltar</button>
        <button type="button" onClick={create} className={btn.primary}>Criar módulo</button>
      </div>
    </div>
  );
}

/* ------------------------- Configurações e backup -------------------------- */
function SettingsModal({ modules, mod, savedAt, onClose, onReset, onImport, notify }) {
  const fileRef = useRef(null);
  const totalClients = modules.reduce((s, m) => s + m.clients.length, 0);
  const stamp = todayISO();

  const exportJSON = () => {
    downloadFile("prospera-crm-backup-" + stamp + ".json", JSON.stringify(modules, null, 2), "application/json");
    notify({ title: "Backup exportado", message: "Guarde o arquivo em um lugar seguro." });
  };
  const exportCSV = () => {
    const cur = mod.fields.find((f) => f.type === "currency");
    const head = ["Nome", "Empresa", "Telefone", "E-mail", "Etapa", mod.itemLabelPlural, "Qtd. itens", "Valor total", "Observações", "Cadastrado em", "Atualizado em"];
    const rows = mod.clients.map((c) => [
      c.nome, c.empresa, c.telefone, c.email, statusMeta(c.status).label,
      c.items.map((it) => itemTitle(mod, it) + (cur ? " (" + BRL(itemValue(mod, it)) + ")" : "")).join(" | "),
      c.items.length, clientValue(mod, c).toFixed(2).replace(".", ","), c.obs, fmtDateTime(c.createdAt), fmtDateTime(c.updatedAt),
    ]);
    const csv = "﻿" + [head, ...rows].map((r) => r.map(csvCell).join(";")).join("\r\n");
    downloadFile("prospera-crm-" + mod.id + "-" + stamp + ".csv", csv, "text/csv;charset=utf-8");
    notify({ title: "Planilha exportada", message: mod.clients.length + " cliente(s) de " + mod.nome });
  };
  const onFile = (e) => {
    const file = e.target.files && e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = () => {
      try {
        const parsed = JSON.parse(String(reader.result));
        if (!Array.isArray(parsed) || parsed.length === 0 || !parsed.every((m) => m && m.id && m.nome)) throw new Error("formato");
        onImport(parsed);
      } catch (err) {
        notify({ title: "Arquivo inválido", message: "Escolha um backup .json gerado por este CRM.", kind: "error" });
      }
    };
    reader.readAsText(file);
    e.target.value = "";
  };

  const Row = ({ icon: IconC, title, text, children, tone }) => (
    <div className={"flex flex-col gap-3 rounded-xl border p-4 sm:flex-row sm:items-center " + (tone === "danger" ? "border-red-100 bg-red-50/40" : "border-slate-200")}>
      <span className={"flex h-10 w-10 shrink-0 items-center justify-center rounded-xl " + (tone === "danger" ? "bg-red-100 text-red-600" : "bg-slate-100 text-slate-500")}><IconC size={18} /></span>
      <div className="min-w-0 flex-1">
        <div className="text-sm font-semibold text-ink">{title}</div>
        <div className="text-xs leading-relaxed text-slate-500">{text}</div>
      </div>
      <div className="flex shrink-0 gap-2">{children}</div>
    </div>
  );

  return (
    <Modal title="Configurações e backup" subtitle="Onde os dados ficam e como protegê-los" icon={I.Cog} onClose={onClose}>
      <div className="mb-5 flex items-start gap-3 rounded-xl border border-brand-100 bg-brand-50/60 p-4 text-sm text-slate-700">
        <span className="mt-0.5 shrink-0 text-brand"><I.Info size={18} /></span>
        <div>
          <b className="text-ink">Os dados ficam somente neste navegador.</b> Hoje são {modules.length} módulo(s) e {totalClients} cliente(s).
          Nada é enviado para servidores, então limpar o histórico do navegador apaga tudo. Exporte um backup de vez em quando.
          {savedAt && <span className="mt-1 block text-xs text-slate-500">Último salvamento automático: {fmtDateTime(new Date(savedAt).toISOString())}</span>}
        </div>
      </div>

      <div className="space-y-3">
        <Row icon={I.Download} title="Exportar backup completo" text="Gera um arquivo .json com todos os módulos e clientes. Serve para restaurar em outro computador.">
          <button onClick={exportJSON} className={btn.primary}><I.Download size={16} /> Exportar</button>
        </Row>
        <Row icon={I.Upload} title="Importar backup" text="Substitui os dados atuais pelos do arquivo .json escolhido.">
          <input ref={fileRef} type="file" accept="application/json,.json" className="hidden" onChange={onFile} />
          <button onClick={() => fileRef.current && fileRef.current.click()} className={btn.secondary}><I.Upload size={16} /> Escolher arquivo</button>
        </Row>
        <Row icon={I.Table} title={"Exportar planilha de " + mod.nome} text="Arquivo .csv com os clientes do módulo atual, pronto para abrir no Excel.">
          <button onClick={exportCSV} className={btn.secondary}><I.Table size={16} /> Exportar CSV</button>
        </Row>
        <Row icon={I.Reset} title="Restaurar dados de exemplo" text="Apaga tudo o que foi salvo e volta aos dados iniciais de demonstração." tone="danger">
          <button onClick={onReset} className={btn.dangerSoft}><I.Reset size={16} /> Restaurar</button>
        </Row>
      </div>

      <div className="mt-6 rounded-xl border border-slate-200 p-4">
        <div className="mb-2 flex items-center gap-2 text-sm font-semibold text-ink"><I.Keyboard size={16} className="text-slate-400" /> Atalhos</div>
        <ul className="grid grid-cols-1 gap-1.5 text-xs text-slate-600 sm:grid-cols-2">
          <li className="flex items-center gap-2"><Kbd>/</Kbd> Ir para a busca</li>
          <li className="flex items-center gap-2"><Kbd>Esc</Kbd> Fechar painel ou janela</li>
          <li className="flex items-center gap-2"><Kbd>Enter</Kbd> Salvar formulário</li>
          <li className="flex items-center gap-2">Arrastar card no funil muda a etapa</li>
        </ul>
      </div>
    </Modal>
  );
}

/* --------------------------- Confirmação e toasts -------------------------- */
function ConfirmDialog({ title, message, confirmLabel = "Confirmar", danger, onCancel, onConfirm }) {
  const ref = useRef(null);
  useEffect(() => { ref.current && ref.current.focus(); }, []);
  return (
    <div className="fixed inset-0 z-[60] flex items-center justify-center p-4" role="alertdialog" aria-modal="true" aria-label={title}>
      <div className="absolute inset-0 bg-ink/50 backdrop-blur-[2px] anim-fade" onClick={onCancel} />
      <div className="relative w-full max-w-md rounded-2xl bg-white p-6 shadow-pop anim-pop">
        <div className="flex items-start gap-4">
          <span className={"flex h-11 w-11 shrink-0 items-center justify-center rounded-xl " + (danger ? "bg-red-100 text-red-600" : "bg-brand-50 text-brand")}><I.Alert size={22} /></span>
          <div className="min-w-0">
            <h2 className="text-base font-bold text-ink">{title}</h2>
            {message && <p className="mt-1 text-sm leading-relaxed text-slate-600">{message}</p>}
          </div>
        </div>
        <div className="mt-6 flex justify-end gap-2.5">
          <button ref={ref} type="button" onClick={onCancel} className={btn.secondary}>Cancelar</button>
          <button type="button" onClick={onConfirm} className={danger ? btn.danger : btn.primary}>{confirmLabel}</button>
        </div>
      </div>
    </div>
  );
}

function Toasts({ toasts, onDismiss }) {
  if (!toasts.length) return null;
  const tone = { success: "text-emerald-600", info: "text-brand", error: "text-red-600" };
  const IconFor = { success: I.Check, info: I.Info, error: I.Alert };
  return (
    <div className="pointer-events-none fixed bottom-4 right-4 z-[70] flex w-[min(380px,calc(100vw-2rem))] flex-col gap-2" aria-live="polite">
      {toasts.map((t) => { const Ic = IconFor[t.kind] || I.Check; return (
        <div key={t.id} className="pointer-events-auto flex items-start gap-3 rounded-xl border border-slate-200 bg-white px-4 py-3 shadow-pop anim-toast">
          <span className={"mt-0.5 shrink-0 " + (tone[t.kind] || tone.success)}><Ic size={18} /></span>
          <div className="min-w-0 flex-1">
            <div className="text-sm font-semibold text-ink">{t.title}</div>
            {t.message && <div className="truncate text-xs text-slate-500">{t.message}</div>}
          </div>
          {t.action && <button onClick={() => { t.action.onClick(); onDismiss(t.id); }} className="shrink-0 rounded-lg px-2 py-1 text-xs font-bold text-brand hover:bg-brand-50">{t.action.label}</button>}
          <button onClick={() => onDismiss(t.id)} className="shrink-0 text-slate-300 hover:text-slate-600" aria-label="Fechar aviso"><I.X size={15} /></button>
        </div>
      ); })}
    </div>
  );
}

/* --------------------------------- mount ---------------------------------- */
try {
  ReactDOM.createRoot(document.getElementById("root")).render(<ProsperaCRM />);
  var boot = document.getElementById("boot");
  if (boot) boot.remove();
} catch (err) {
  if (window.__crmError) window.__crmError(err && err.message ? err.message : String(err));
  throw err;
}
</script>
</body>
</html>
