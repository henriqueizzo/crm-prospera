<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
<style>
  :root { --blue: #3152E4; --blue-dark: #2541B8; --ink: #1A1A2E; --canvas: #F7F9FA; color-scheme: light; }
  html, body, #root { height: 100%; }
  body { font-family: 'Inter', ui-sans-serif, system-ui, sans-serif; margin: 0; background: var(--canvas); color: var(--ink); -webkit-font-smoothing: antialiased; text-rendering: optimizeLegibility; }
  ::selection { background: rgba(49,82,228,.18); color: var(--ink); }

  /* Barras de rolagem: padrão (10px) e fina (.scroll-thin, 6px) para listas e colunas do funil */
  ::-webkit-scrollbar { width: 10px; height: 10px; }
  ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; border: 2px solid transparent; background-clip: padding-box; }
  ::-webkit-scrollbar-thumb:hover { background: #94a3b8; background-clip: padding-box; border: 2px solid transparent; }
  ::-webkit-scrollbar-track { background: transparent; }
  .scroll-thin { scrollbar-width: thin; scrollbar-color: #cbd5e1 transparent; }
  .scroll-thin::-webkit-scrollbar { width: 6px; height: 6px; }
  .scroll-thin::-webkit-scrollbar-thumb { background: #cbd5e1; border: 0; border-radius: 6px; background-clip: border-box; }
  .scroll-thin::-webkit-scrollbar-thumb:hover { background: #94a3b8; border: 0; }

  :where(button, a, [tabindex]):focus-visible { outline: 2px solid var(--blue); outline-offset: 2px; }
  :where(button, a):not(:disabled) { transition: color .15s, background-color .15s, border-color .15s, box-shadow .15s, opacity .15s, transform .15s; transition-timing-function: cubic-bezier(.2,.8,.2,1); }
  input[type=number]::-webkit-inner-spin-button, input[type=number]::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }
  input[type=number] { -moz-appearance: textfield; }
  input[type=date]::-webkit-calendar-picker-indicator { opacity: .55; cursor: pointer; }
  .tnum { font-variant-numeric: tabular-nums; }

  /* Cartão que "levanta" ao passar o mouse (cards do funil, listas clicáveis) */
  .card-hover { transition: transform .18s cubic-bezier(.2,.8,.2,1), box-shadow .18s ease, border-color .18s ease; }
  .card-hover:hover { transform: translateY(-1px); box-shadow: 0 18px 40px -18px rgba(26,26,46,.28), 0 2px 6px rgba(26,26,46,.06); border-color: rgba(49,82,228,.4); }

  /* Esqueleto de carregamento (shimmer), para uso futuro: <div class="skeleton h-4 w-32"></div> */
  .skeleton { position: relative; overflow: hidden; background: #e9edf2; border-radius: 8px; color: transparent !important; }
  .skeleton::after { content: ""; position: absolute; inset: 0; transform: translateX(-100%); background: linear-gradient(90deg, transparent, rgba(255,255,255,.75), transparent); animation: shimmer 1.4s infinite; }
  @keyframes shimmer { 100% { transform: translateX(100%); } }

  @keyframes fadeIn { from { opacity: 0 } to { opacity: 1 } }
  @keyframes slideRight { from { transform: translateX(28px); opacity: 0 } to { transform: none; opacity: 1 } }
  @keyframes slideLeft { from { transform: translateX(-28px); opacity: 0 } to { transform: none; opacity: 1 } }
  @keyframes slideUp { from { transform: translateY(40px); opacity: 0 } to { transform: none; opacity: 1 } }
  @keyframes popIn { from { transform: translateY(10px) scale(.985); opacity: 0 } to { transform: none; opacity: 1 } }
  @keyframes toastIn { from { transform: translateY(14px); opacity: 0 } to { transform: none; opacity: 1 } }
  @keyframes toastBar { from { width: 100% } to { width: 0 } }
  .anim-fade { animation: fadeIn .18s ease-out both; }
  .anim-slide-right { animation: slideRight .24s cubic-bezier(.2,.8,.2,1) both; }
  .anim-slide-left { animation: slideLeft .24s cubic-bezier(.2,.8,.2,1) both; }
  .anim-slide-up { animation: slideUp .26s cubic-bezier(.2,.8,.2,1) both; }
  .anim-pop { animation: popIn .2s cubic-bezier(.2,.8,.2,1) both; }
  .anim-toast { animation: toastIn .22s cubic-bezier(.2,.8,.2,1) both; }
  /* Modais: no celular sobem de baixo (folha); no desktop "pulam" centralizados */
  .anim-sheet { animation: slideUp .26s cubic-bezier(.2,.8,.2,1) both; }
  @media (min-width: 640px) { .anim-sheet { animation: popIn .2s cubic-bezier(.2,.8,.2,1) both; } }
  .toast-bar { position: absolute; left: 0; bottom: 0; height: 3px; width: 100%; border-bottom-left-radius: 12px; background: currentColor; opacity: .35; animation: toastBar linear forwards; }
  .toast:hover .toast-bar { animation-play-state: paused; }
  @media (prefers-reduced-motion: reduce) {
    .anim-fade, .anim-slide-right, .anim-slide-left, .anim-slide-up, .anim-sheet, .anim-pop, .anim-toast, .toast-bar, .skeleton::after { animation: none; }
    * { transition: none !important; }
  }

  /* Impressão: esconde o que não faz sentido no papel (use class="no-print") */
  @media print {
    .no-print { display: none !important; }
    body { background: #fff; }
  }

  /* Tela de carregamento, com a marca */
  #boot { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; color: #475569; background: var(--canvas); font-family: 'Inter', system-ui, sans-serif; z-index: 100; }
  #boot .brand { display: flex; align-items: center; gap: 10px; margin-bottom: 6px; }
  #boot .brand b { font-size: 26px; font-weight: 800; letter-spacing: -.02em; color: var(--ink); text-transform: lowercase; }
  #boot .brand span { font-size: 10px; font-weight: 700; letter-spacing: .08em; color: var(--blue); background: #EFF4FF; border-radius: 6px; padding: 3px 6px; }
  #boot .ring { width: 34px; height: 34px; border: 4px solid #e2e8f0; border-top-color: var(--blue); border-radius: 50%; animation: spin .8s linear infinite; }
  #boot .msg { font-size: 13px; }
  @keyframes spin { to { transform: rotate(360deg); } }
  #boot.err { color: #b91c1c; padding: 24px; text-align: center; }
  #boot.err .ring, #boot.err .brand { display: none; }
  #boot code { display: block; margin-top: 8px; max-width: 90vw; overflow: auto; background: #fef2f2; border: 1px solid #fecaca; border-radius: 8px; padding: 8px 10px; font-size: 12px; color: #7f1d1d; white-space: pre-wrap; }
</style>

<body>
<div id="root"></div>
<div id="boot"><div class="brand"><b>próspera</b><span>CRM</span></div><div class="ring"></div><div class="msg">Carregando o CRM…</div></div>

<script>
/* Tela de carregamento + captura de erros: garante que nunca fique "branco mudo". */
(function () {
  function showError(msg) {
    var b = document.getElementById("boot");
    if (!b) return;
    b.className = "err";
    b.innerHTML = '<div style="font-weight:700;font-size:16px">Não foi possível carregar o CRM</div>' +
      '<div style="font-size:13px;max-width:520px">Isso costuma ser uma biblioteca externa bloqueada (rede, extensão ou firewall). Tente outro navegador ou uma aba anônima sem extensões.</div>' +
      '<code>' + String(msg).replace(/[<>&]/g, function (c) { return ({'<':'&lt;','>':'&gt;','&':'&amp;'}[c]); }) + '</code>';
  }
  window.__crmError = showError;
  window.addEventListener("error", function (e) {
    if (e && e.message) showError(e.message + (e.filename ? "  ("+e.filename+")" : ""));
  });
  setTimeout(function () {
    var root = document.getElementById("root");
    if (root && root.childElementCount === 0) {
      if (!window.React) return showError("React não carregou (CDN unpkg.com bloqueado?).");
      if (!window.Babel) return showError("Babel não carregou (CDN unpkg.com bloqueado?).");
      showError("O aplicativo não renderizou. Abra o Console (F12) para ver o detalhe.");
    }
  }, 12000);
})();
</script>

<script type="text/babel" data-presets="react" data-type="module">
/* >>> src/01-core.js */
const { useState, useMemo, useRef, useEffect, useCallback } = React;

/* ============================================================================
   Próspera CRM — arquivo HTML único, dados salvos no navegador (localStorage).
   Módulos independentes (Benefícios, Adquirência + criados pelo usuário), cada
   um com sua lista de clientes e seu esquema de campos.
============================================================================ */
const BRAND = "#3152E4";

/* Cores das etapas: usadas em pontos, barras e bordas; o texto nunca fica
   branco sobre elas (badges usam fundo suave + texto escuro). */
const STATUSES = [
  { key: "lead",       label: "Lead",          color: "#3152E4", soft: "#EFF4FF", text: "#2541B8", hint: "Primeiro contato" },
  { key: "negociacao", label: "Em negociação", color: "#D97706", soft: "#FEF3C7", text: "#92400E", hint: "Proposta em andamento" },
  { key: "fechado",    label: "Fechado",       color: "#047857", soft: "#E6F6EE", text: "#065F46", hint: "Contrato assinado" },
  { key: "perdido",    label: "Perdido",       color: "#DC2626", soft: "#FEE2E2", text: "#991B1B", hint: "Não avançou" },
];
const statusMeta = (k) => STATUSES.find((s) => s.key === k) || STATUSES[0];

const ITEM_STATUS = [
  { key: "interesse", label: "De interesse" },
  { key: "contratado", label: "Contratado" },
];

const FIELD_TYPES = [
  { key: "text", label: "Texto" },
  { key: "number", label: "Número" },
  { key: "currency", label: "Valor (R$)" },
  { key: "status", label: "Status (interesse/contratado)" },
];

/* -------------------------------- helpers --------------------------------- */
const BRL = (v) => (Number(v) || 0).toLocaleString("pt-BR", { style: "currency", currency: "BRL" });
const onlyDigits = (s) => (s || "").replace(/\D/g, "");
const uid = () => Math.random().toString(36).slice(2, 10);
const pad2 = (n) => String(n).padStart(2, "0");
const toISODate = (d) => d.getFullYear() + "-" + pad2(d.getMonth() + 1) + "-" + pad2(d.getDate());
const todayISO = () => toISODate(new Date());
const daysFromNow = (n) => { const d = new Date(); d.setDate(d.getDate() + n); return toISODate(d); };
const nowISO = () => new Date().toISOString();
const hoursAgo = (h) => new Date(Date.now() - h * 3600e3).toISOString();

function fmtDate(d) { if (!d) return "sem data"; const [y, m, day] = d.split("-"); return day + "/" + m + "/" + y; }
function isOverdue(d) { return !!d && d < todayISO(); }
function daysUntil(d) {
  if (!d) return null;
  const a = new Date(d + "T00:00:00"), b = new Date(todayISO() + "T00:00:00");
  return Math.round((a - b) / 864e5);
}
function relTime(iso) {
  if (!iso) return "";
  const diff = Date.now() - new Date(iso).getTime();
  const m = Math.floor(diff / 60000);
  if (m < 1) return "agora";
  if (m < 60) return "há " + m + " min";
  const h = Math.floor(m / 60);
  if (h < 24) return "há " + h + " h";
  const d = Math.floor(h / 24);
  if (d === 1) return "ontem";
  if (d < 30) return "há " + d + " dias";
  return new Date(iso).toLocaleDateString("pt-BR");
}
function fmtDateTime(iso) {
  if (!iso) return "";
  return new Date(iso).toLocaleString("pt-BR", { day: "2-digit", month: "2-digit", year: "numeric", hour: "2-digit", minute: "2-digit" });
}
function greeting() { const h = new Date().getHours(); return h < 12 ? "Bom dia" : h < 18 ? "Boa tarde" : "Boa noite"; }
function longToday() {
  const s = new Date().toLocaleDateString("pt-BR", { weekday: "long", day: "numeric", month: "long", year: "numeric" });
  return s.charAt(0).toUpperCase() + s.slice(1);
}
function initials(name) { return (name || "?").split(" ").filter(Boolean).slice(0, 2).map((p) => p[0].toUpperCase()).join(""); }
const AVATAR_COLORS = ["#3152E4", "#7C3AED", "#047857", "#B45309", "#BE185D", "#0E7490", "#4338CA", "#9F1239"];
function avatarColor(name) {
  let h = 0;
  for (const ch of (name || "")) h = (h * 31 + ch.charCodeAt(0)) >>> 0;
  return AVATAR_COLORS[h % AVATAR_COLORS.length];
}
function maskPhone(v) {
  const d = onlyDigits(v).slice(0, 11);
  if (!d) return "";
  if (d.length <= 2) return "(" + d;
  if (d.length <= 6) return "(" + d.slice(0, 2) + ") " + d.slice(2);
  if (d.length <= 10) return "(" + d.slice(0, 2) + ") " + d.slice(2, 6) + "-" + d.slice(6);
  return "(" + d.slice(0, 2) + ") " + d.slice(2, 7) + "-" + d.slice(7);
}
const isEmail = (s) => !s || /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(s.trim());
function downloadFile(name, content, type) {
  const blob = new Blob([content], { type });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url; a.download = name; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
}
/* Célula de CSV: protege contra fórmulas (= + - @ no início viram texto) e escapa aspas/quebras de linha. */
const csvCell = (v) => { let s = String(v ?? ""); if (/^[=+\-@\t\r]/.test(s)) s = "'" + s; return /[;"\n\r]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s; };
const isTyping = (el) => !!el && (["INPUT", "TEXTAREA", "SELECT"].includes(el.tagName) || el.isContentEditable);
const VIEW_HASH = { painel: "dashboard", dashboard: "dashboard", clientes: "clientes", funil: "funil", relatorios: "relatorios", agenda: "agenda" };

/* ----------------------------- constantes v3 ------------------------------ */
/* Porte da empresa e interesse do cliente (entram na pontuação de prioridade). */
const PORTES = [
  { key: "mei",     label: "MEI / autônomo" },
  { key: "pequena", label: "Pequena (até 50 func.)" },
  { key: "media",   label: "Média (51 a 250)" },
  { key: "grande",  label: "Grande (250+)" },
];
const INTERESSES = [
  { key: "baixo", label: "Baixo", color: "#64748B", soft: "#F1F5F9", text: "#475569" },
  { key: "medio", label: "Médio", color: "#D97706", soft: "#FEF3C7", text: "#92400E" },
  { key: "alto",  label: "Alto",  color: "#047857", soft: "#E6F6EE", text: "#065F46" },
];
/* Níveis de prioridade (resultado de scoreClient) e tons do prazo na etapa (slaStatus). */
const SCORE_LEVELS = {
  alta:  { key: "alta",  label: "Alta",  color: "#C2410C", soft: "#FFEDD5", text: "#9A3412" },
  media: { key: "media", label: "Média", color: "#D97706", soft: "#FEF3C7", text: "#92400E" },
  baixa: { key: "baixa", label: "Baixa", color: "#64748B", soft: "#F1F5F9", text: "#475569" },
};
const SLA_TONES = {
  ok:   { color: "#64748B", soft: "#F1F5F9", text: "#475569" },
  warn: { color: "#D97706", soft: "#FEF3C7", text: "#92400E" },
  late: { color: "#DC2626", soft: "#FEE2E2", text: "#991B1B" },
};
/* Campos que podem ser exigidos para mover um cliente para uma etapa. */
const REQUIRED_FIELD_KEYS = [
  { key: "empresa",     label: "Empresa" },
  { key: "telefone",    label: "Telefone" },
  { key: "email",       label: "E-mail" },
  { key: "origem",      label: "Origem" },
  { key: "responsavel", label: "Responsável" },
  { key: "porte",       label: "Porte" },
  { key: "interesse",   label: "Interesse" },
  { key: "valor",       label: "Valor (ao menos um item com valor)" },
  { key: "itens",       label: "Ao menos um item" },
];

/* Texto normalizado para comparar nomes/empresas (minúsculo, sem acento, sem espaços extras). */
function coreNormalizeText(s) {
  return String(s || "").toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g, "").replace(/\s+/g, " ").trim();
}
/* Mesmo mês/ano de uma data ISO em relação a uma data de referência (padrão: hoje). */
function isSameMonth(iso, ref = new Date()) {
  if (!iso) return false;
  const d = new Date(iso);
  if (isNaN(d.getTime())) return false;
  const r = ref instanceof Date ? ref : new Date(ref);
  return d.getFullYear() === r.getFullYear() && d.getMonth() === r.getMonth();
}
function porteLabel(key) { const p = PORTES.find((x) => x.key === key); return p ? p.label : ""; }
function interesseMeta(key) { return INTERESSES.find((x) => x.key === key) || null; }

/* ============================== NOVIDADES v4 ==============================
   Tarefas com hora e tipo, registro de contato, histórico tipado, "Só meus",
   clientes de exemplo (demo), importação/exportação de planilha (CSV).
   As funções abaixo usam helpers de 04-storage.js (pendingTasks, scoreClient...)
   só em tempo de execução, por isso podem ficar aqui.
============================================================================ */

/* ------------------------------- tarefas --------------------------------- */
const TASK_TYPES = [
  { key: "ligacao",  label: "Ligação",  icon: "Phone" },
  { key: "whatsapp", label: "WhatsApp", icon: "Chat" },
  { key: "email",    label: "E-mail",   icon: "Mail" },
  { key: "reuniao",  label: "Reunião",  icon: "Calendar" },
  { key: "outro",    label: "Outro",    icon: "Flag" },
];
function taskTypeMeta(key) { return TASK_TYPES.find((t) => t.key === key) || null; }
/* Tons do "quando" da tarefa: atrasada (vermelho), hoje (azul Próspera), em breve (âmbar), depois (cinza), sem data (cinza claro). */
const TASK_TONES = {
  late:  { color: "#DC2626", soft: "#FEE2E2", text: "#991B1B" },
  today: { color: "#3152E4", soft: "#EFF4FF", text: "#2541B8" },
  soon:  { color: "#D97706", soft: "#FEF3C7", text: "#92400E" },
  ok:    { color: "#64748B", soft: "#F1F5F9", text: "#475569" },
  none:  { color: "#94A3B8", soft: "#F8FAFC", text: "#64748B" },
};
const WEEKDAYS_SHORT = ["dom", "seg", "ter", "qua", "qui", "sex", "sáb"];
const isValidHora = (h) => typeof h === "string" && /^([01]\d|2[0-3]):[0-5]\d$/.test(h);
function isValidISODate(d) {
  if (typeof d !== "string" || !/^\d{4}-\d{2}-\d{2}$/.test(d)) return false;
  const dt = new Date(d + "T00:00:00");
  return !isNaN(dt.getTime()) && toISODate(dt) === d;
}
function isTodayISO(d) { return isValidISODate(d) && d === todayISO(); }
/* Soma n dias (em horário local) a uma data ISO; base inválida = hoje. */
function addDaysISO(iso, n) {
  const base = new Date((isValidISODate(iso) ? iso : todayISO()) + "T00:00:00");
  base.setDate(base.getDate() + (Number(n) || 0));
  return toISODate(base);
}
/* Texto curto de "quando" a tarefa vence + tom de cor (ver TASK_TONES). */
function taskWhen(task) {
  const t = task || {};
  const hora = isValidHora(t.hora) ? " " + t.hora : "";
  if (t.feito) return { label: "concluída", tone: "ok" };
  if (!isValidISODate(t.data)) return { label: "sem data", tone: "none" };
  const diff = daysUntil(t.data);
  if (diff < 0) return { label: diff === -1 ? "atrasada desde ontem" : "atrasada há " + (-diff) + " dias", tone: "late" };
  if (diff === 0) return { label: "hoje" + hora, tone: "today" };
  if (diff === 1) return { label: "amanhã" + hora, tone: "soon" };
  const parts = t.data.split("-");
  const dm = parts[2] + "/" + parts[1];
  if (diff <= 7) return { label: WEEKDAYS_SHORT[new Date(t.data + "T00:00:00").getDay()] + " " + dm + hora, tone: "soon" };
  return { label: dm + hora, tone: "ok" };
}
/* Cópia ordenada: data (sem data por último), depois hora, depois título. */

function parseCSV(text) {

    } else if (ch === '"') inQ = true;

/* Tarefa de exemplo: dias a partir de hoje, tipo (ligacao/whatsapp/email/reuniao/outro) e opcionais (hora, auto, feito em h atrás). */
const seedTask = (titulo, dias, tipo, extra) => {
  const o = extra || {};
  const t = { id: uid(), titulo, data: daysFromNow(dias), hora: o.hora || "", tipo: tipo || "", feito: !!o.feitoH, auto: !!o.auto };
  if (o.feitoH) t.feitoEm = hoursAgo(o.feitoH);
  return t;
};

const storageClone = (v) => JSON.parse(JSON.stringify(v));

/* Garante que qualquer settings salvo (ou parcial) tenha todos os campos válidos. */
function hydrateSettings(s) {

  const src = s && typeof s === "object" ? s : {};
  const out = {};
  out.vendedores = storageList(src.vendedores, d.vendedores).map((v) => ({ id: storageStr(v.id) || uid(), nome: storageStr(v.nome), metaMensal: storageNum(v.metaMensal, 0) }));
  out.origens = storageList(src.origens, d.origens).map((o) => ({ id: storageStr(o.id) || uid(), label: storageStr(o.label) }));
  out.motivosPerda = storageList(src.motivosPerda, d.motivosPerda).map((o) => ({ id: storageStr(o.id) || uid(), label: storageStr(o.label) }));
  out.usuarioAtual = storageStr(src.usuarioAtual);
  if (out.usuarioAtual && !out.vendedores.some((v) => v.id === out.usuarioAtual)) out.usuarioAtual = "";

  const sla = src.sla && typeof src.sla === "object" ? src.sla : {};
  out.sla = {};
  STATUSES.forEach((st) => { out.sla[st.key] = storageNum(sla[st.key], d.sla[st.key] || 0); });

  const req = src.required && typeof src.required === "object" ? src.required : {};
  out.required = {};
  STATUSES.forEach((st) => {
    const list = Array.isArray(req[st.key]) ? req[st.key] : d.required[st.key];
    out.required[st.key] = list.map(storageStr).filter((k) => REQUIRED_FIELD_KEYS.some((f) => f.key === k));
  });

  const sc = src.scoring && typeof src.scoring === "object" ? src.scoring : {};
  const scoreMap = (obj, def) => { const o = obj && typeof obj === "object" ? obj : {}; const r = {}; Object.keys({ ...def, ...o }).forEach((k) => { r[k] = storageNum(o[k], def[k] != null ? def[k] : 0); }); return r; };
  out.scoring = {
    porte: scoreMap(sc.porte, d.scoring.porte),
    interesse: scoreMap(sc.interesse, d.scoring.interesse),
    porItem: storageNum(sc.porItem, d.scoring.porItem),
    contatoCompleto: storageNum(sc.contatoCompleto, d.scoring.contatoCompleto),
    origem: scoreMap(sc.origem, d.scoring.origem),
    limites: { alta: storageNum(sc.limites && sc.limites.alta, d.scoring.limites.alta), media: storageNum(sc.limites && sc.limites.media, d.scoring.limites.media) },
  };

  out.automations = storageList(src.automations, d.automations).map((a) => {
    const trig = a.trigger && typeof a.trigger === "object" ? a.trigger : {};
    const act = a.action && typeof a.action === "object" ? a.action : {};
    const type = trig.type === "client_created" ? "client_created" : "enter_stage";
    return {
      id: storageStr(a.id) || uid(), nome: storageStr(a.nome), ativo: a.ativo !== false,

    id: storageStr(t.id) || uid(), nome: storageStr(t.nome), canal: t.canal === "email" ? "email" : "whatsapp",
    assunto: storageStr(t.assunto), texto: storageStr(t.texto),

/* Se o texto salvo estiver ilegível (JSON quebrado), guardamos uma cópia bruta em outra chave

let storageLoadIssue = null;
function storageKeepCorrupted(kind, key, raw, err) {
  const backupKey = key + "_corrompido_" + Date.now();
  try { window.localStorage.setItem(backupKey, raw); } catch (e) {}
  console.warn("Dados salvos ilegíveis (" + kind + "); cópia guardada em " + backupKey, err);
  if (!storageLoadIssue) storageLoadIssue = { kind, backupKey };
}
function takeStorageLoadIssue() { const i = storageLoadIssue; storageLoadIssue = null; return i; }
function loadSettings() {
  const fallback = () => hydrateSettings(storageClone(DEFAULT_SETTINGS));
  let raw = null;
  try { raw = window.localStorage.getItem(SETTINGS_KEY); } catch (e) { console.warn("Sem acesso ao localStorage; usando padrão.", e); return fallback(); }
  if (!raw) return fallback();
  try { return hydrateSettings(JSON.parse(raw)); }
  catch (e) { storageKeepCorrupted("settings", SETTINGS_KEY, raw, e); return fallback(); }
}
function saveSettings(s) {

  catch (e) { console.warn("Não foi possível salvar as configurações.", e); return false; }

/* Deduz o tipo de uma entrada antiga do histórico pelo começo do texto (só para o ícone na linha do tempo). */
function storageHistoryTipo(text) {
  const t = coreNormalizeText(text);
  if (/^cliente cadastrado|^importado/.test(t)) return "cadastro";
  if (/^etapa alterada/.test(t)) return "etapa";
  if (/^tarefa/.test(t)) return "tarefa";
  if (/^nota/.test(t)) return "nota";
  if (/^mensagem/.test(t)) return "mensagem";
  if (/^whatsapp aberto|^ligacao iniciada|^e-mail aberto|^ligacao:|^whatsapp:|^e-mail:|^reuniao:|^contato:/.test(t)) return "contato";
  if (/^proposta/.test(t)) return "proposta";
  if (/^dados do cliente|^perfil|^responsavel alterado|alterad[oa] para/.test(t)) return "dados";
  if (/adicionad|removid|atualizad|marcado como/.test(t)) return "item";
  return "";
}
function hydrateClient(c) {
  const now = nowISO();
  const base = {
    items: [], tasks: [], history: [], comments: [], stageLog: [],
    obs: "", empresa: "", telefone: "", email: "", status: "lead",
    origem: "", responsavel: "", porte: "", interesse: "", motivoPerda: "", motivoPerdaObs: "",
    ...c,
  };
  base.demo = !!base.demo;
  base.items = (Array.isArray(base.items) ? base.items : []).filter((x) => x && typeof x === "object");
  /* v4: toda tarefa tem hora e tipo (strings, podem ser vazias); concluídas podem ter feitoEm. */
  base.tasks = (Array.isArray(base.tasks) ? base.tasks : []).filter((t) => t && typeof t === "object").map((t) => {
    const out = { ...t, id: storageStr(t.id) || uid(), titulo: storageStr(t.titulo),
      data: /^\d{4}-\d{2}-\d{2}$/.test(storageStr(t.data)) ? t.data : "",
      hora: /^\d{2}:\d{2}$/.test(storageStr(t.hora)) ? t.hora : "",
      tipo: TASK_TYPES.some((x) => x.key === t.tipo) ? t.tipo : "", feito: !!t.feito, auto: !!t.auto };
    if (!out.feito) delete out.feitoEm; else if (out.feitoEm != null) out.feitoEm = storageStr(out.feitoEm);
    return out;
  });
  /* v4: histórico tipado (entradas antigas ganham o tipo pelo texto, só para o ícone). */
  base.history = (Array.isArray(base.history) ? base.history : []).filter((h) => h && typeof h === "object" && h.text).map((h) => ({
    ...h, id: storageStr(h.id) || uid(), at: storageStr(h.at) || now, text: storageStr(h.text),
    tipo: HISTORY_TIPOS.includes(h.tipo) ? h.tipo : storageHistoryTipo(h.text),
  }));
  base.comments = (Array.isArray(base.comments) ? base.comments : []).filter((x) => x && typeof x === "object" && x.text);
  base.createdAt = base.createdAt || now;
  base.updatedAt = base.updatedAt || base.createdAt;
  if (!STATUSES.some((s) => s.key === base.status)) base.status = "lead";
  ["origem", "responsavel", "porte", "interesse", "motivoPerda", "motivoPerdaObs", "obs", "empresa", "telefone", "email"].forEach((k) => { base[k] = storageStr(base[k]); });
  /* stageLog: cronológico, última entrada = etapa atual. Dados antigos ganham a entrada inicial. */
  base.stageLog = (Array.isArray(base.stageLog) ? base.stageLog : []).filter((e) => e && e.status && e.at);
  if (base.stageLog.length === 0) base.stageLog = [{ status: base.status, at: base.createdAt }];
  const last = base.stageLog[base.stageLog.length - 1];
  if (last.status !== base.status) base.stageLog = [...base.stageLog, { status: base.status, at: base.updatedAt || now }];
  return base;
}
/* Campo em R$ que representa o VALOR DO NEGÓCIO do módulo (v4). */
function moduleValueField(mod) {
  if (!mod || !Array.isArray(mod.fields)) return null;
  return mod.fields.find((f) => f && f.id === mod.valueField && f.type === "currency") || null;
}
function hydrateModule(m) {
  const src = m && typeof m === "object" ? m : {};
  const accent = LEGACY_ACCENT[String(src.accent || "").toUpperCase()] || src.accent || BRAND;
  let fields = (Array.isArray(src.fields) ? src.fields : []).filter((f) => f && typeof f === "object" && f.id);
  let valueField = storageStr(src.valueField);
  /* Migração do módulo nativo de Adquirência salvo por versões anteriores: ganha o campo "receita"
     (logo após o TPV) e passa a usá-lo como valor do negócio. Itens antigos ficam com receita 0. */
  if (src.id === "adquirencia" && !fields.some((f) => f.id === "receita")) {
    const rf = { id: "receita", label: "Receita mensal estimada (R$)", type: "currency" };
    const i = fields.findIndex((f) => f.id === "tpv");
    fields = i >= 0 ? [...fields.slice(0, i + 1), rf, ...fields.slice(i + 1)] : [...fields, rf];
    valueField = "receita";
  }
  if (src.id === "adquirencia" && !valueField) valueField = "receita";
  if (!fields.some((f) => f.id === valueField && f.type === "currency")) {
    const cf = fields.find((f) => f.type === "currency");
    valueField = cf ? cf.id : "";
  }
  return {
    icon: "Grid", options: [], itemLabel: "Item", itemLabelPlural: "Itens", ...src, accent, fields, valueField,
    clients: Array.isArray(src.clients) ? src.clients.filter((c) => c && typeof c === "object").map(hydrateClient) : [],
  };
}
function loadModules() {
  const fallback = () => initialModules.map(hydrateModule);
  let raw = null;
  try { raw = window.localStorage.getItem(STORAGE_KEY); } catch (e) { console.warn("Sem acesso ao localStorage; usando dados iniciais.", e); return fallback(); }
  if (!raw) return fallback();
  try {
    const parsed = JSON.parse(raw);
    if (!Array.isArray(parsed) || parsed.length === 0) return fallback();
    return parsed.map(hydrateModule);
  } catch (e) { storageKeepCorrupted("modules", STORAGE_KEY, raw, e); return fallback(); }

/* ------------------------------- BACKUP ----------------------------------- */
function serializeBackup(modules, settings) {
  return JSON.stringify({ app: "prospera-crm", version: 4, exportedAt: nowISO(), modules, settings }, null, 2);
}
/* Aceita o backup antigo (array de módulos, v2) e o novo (objeto com modules + settings, v3). */
function parseBackup(parsed) {
  const validMods = (arr) => Array.isArray(arr) && arr.length > 0 && arr.every((m) => m && typeof m === "object" && m.id && m.nome);
  if (Array.isArray(parsed)) {
    if (!validMods(parsed)) throw new Error("formato");
    return { modules: parsed.map(hydrateModule), settings: null };
  }
  if (parsed && typeof parsed === "object" && validMods(parsed.modules)) {
    return { modules: parsed.modules.map(hydrateModule), settings: parsed.settings && typeof parsed.settings === "object" ? hydrateSettings(parsed.settings) : null };
  }
  throw new Error("formato");
}

/* --------------------------- cálculos de domínio --------------------------- */
function fieldDefault(f) { return f.type === "status" ? "interesse" : (f.type === "number" || f.type === "currency") ? 0 : ""; }
function newItem(mod) {
  const it = { id: uid() };
  mod.fields.forEach((f) => { it[f.id] = fieldDefault(f); });
  const tf = mod.fields.find((f) => f.fromOptions);
  if (tf && mod.options && mod.options.length) it[tf.id] = mod.options[0];
  return it;
}
function itemTitle(mod, item) {
  const tf = mod.fields.find((f) => f.fromOptions) || mod.fields.find((f) => f.type === "text");
  return tf ? (item[tf.id] || mod.itemLabel) : mod.itemLabel;
}
function itemValue(mod, item) {
  const cf = moduleValueField(mod) || (mod.fields || []).find((f) => f.type === "currency");
  return cf ? (Number(item[cf.id]) || 0) : 0;
}
function clientValue(mod, c) { return (c.items || []).reduce((s, it) => s + itemValue(mod, it), 0); }
/* Valor do negócio para TODAS as telas: cliente fechado com itens contratados conta só os
   contratados; nos demais casos, soma de todos os itens (clientValue). */
function dealValue(mod, c) {
  if (!c) return 0;
  const items = Array.isArray(c.items) ? c.items : [];
  if (c.status === "fechado") {
    const contratados = items.filter((it) => it && it.status === "contratado");
    if (contratados.length) return contratados.reduce((s, it) => s + itemValue(mod, it), 0);
  }
  return clientValue(mod, c);
}
function pendingTasks(c) { return (c.tasks || []).filter((t) => !t.feito); }
function overdueTasks(c) { return pendingTasks(c).filter((t) => isOverdue(t.data)); }

/* Quando o cliente entrou na etapa atual e há quantos dias está nela. */
function stageEnteredAt(c) {
  const log = (c && Array.isArray(c.stageLog)) ? c.stageLog : [];
  return log.length ? log[log.length - 1].at : ((c && c.createdAt) || nowISO());
}
/* Dias de calendário desde a entrada na etapa (entrou ontem à noite = 1 dia, não 0). */
function daysInStage(c) {
  const d = new Date(stageEnteredAt(c));
  if (isNaN(d.getTime())) return 0;
  const a = new Date(toISODate(d) + "T00:00:00"), b = new Date(todayISO() + "T00:00:00");
  return Math.max(0, Math.round((b - a) / 864e5));
}
/* Prazo por etapa (SLA): none = sem prazo ou etapa final; ok / warn (>= 70% do prazo) / late (> prazo). */
function slaStatus(settings, c) {
  const days = daysInStage(c);
  const limit = storageNum(settings && settings.sla && settings.sla[c.status], 0);
  const label = days === 0 ? "Entrou hoje na etapa" : days === 1 ? "1 dia na etapa" : days + " dias na etapa";
  if (!limit || c.status === "fechado" || c.status === "perdido") return { days, limit, state: "none", label };
  const state = days > limit ? "late" : days >= limit * 0.7 ? "warn" : "ok";
  return { days, limit, state, label };
}
/* Pontuação de prioridade do lead (0 a 100) pelas regras de settings.scoring. */
function scoreClient(settings, mod, c) {
  const sc = (settings && settings.scoring) || DEFAULT_SETTINGS.scoring;
  let p = 0;
  p += storageNum((sc.porte || {})[c.porte], 0);
  p += storageNum((sc.interesse || {})[c.interesse], 0);
  p += Math.min(3, (c.items || []).length) * storageNum(sc.porItem, 0);
  if (onlyDigits(c.telefone).length >= 10 && String(c.email || "").trim()) p += storageNum(sc.contatoCompleto, 0);
  p += storageNum((sc.origem || {})[c.origem], 0);
  const points = Math.max(0, Math.min(100, Math.round(p)));
  const lim = sc.limites || {};
  const alta = storageNum(lim.alta, 60), media = storageNum(lim.media, 30);
  const level = points >= alta ? "alta" : points >= media ? "media" : "baixa";
  return { points, level, label: SCORE_LEVELS[level].label };
}
/* O que ainda falta preencher para o cliente poder ir para a etapa informada. */
function missingForStage(settings, mod, c, status) {
  const keys = (settings && settings.required && Array.isArray(settings.required[status])) ? settings.required[status] : [];
  return keys
    .map((k) => REQUIRED_FIELD_KEYS.find((f) => f.key === k) || { key: k, label: k })
    .filter((f) => {
      if (f.key === "valor") return !(clientValue(mod, c) > 0);
      if (f.key === "itens") return !((c.items || []).length > 0);
      if (f.key === "telefone") return onlyDigits(c.telefone).length < 10;
      return !String(c[f.key] || "").trim();
    });

/* Possíveis cadastros duplicados: mesmo telefone, e-mail, empresa ou nome. */
function findDuplicates(clients, data, excludeId) {
  const d = data || {};
  const tel = onlyDigits(d.telefone);
  const email = String(d.email || "").trim().toLowerCase();

/* Limite de entradas guardadas na linha do tempo de cada cliente. */
const APP_HISTORY_MAX = 120;
/* Texto gravado no histórico quando o usuário abre um link de contato (ContactIcons / drawer). */
const APP_CONTACT_LINK_TEXT = { whatsapp: "WhatsApp aberto", ligacao: "Ligação iniciada", email: "E-mail aberto" };

/* Tipo do histórico deduzido pelo texto, quando quem grava não informa (só muda o ícone na linha do tempo). */
function appHistoryTipo(text) {
  const t = String(text || "").toLowerCase();
  if (/^etapa alterada/.test(t)) return "etapa";
  if (/^tarefa/.test(t)) return "tarefa";
  if (/^nota/.test(t)) return "nota";
  if (/^cliente cadastrado|^importad/.test(t)) return "cadastro";
  if (/^mensagem/.test(t)) return "mensagem";
  if (/^proposta/.test(t)) return "proposta";
  if (/^dados do cliente|alterad[oa] para|^perfil/.test(t)) return "dados";
  if (/adicionad|removid|atualizad|marcado como/.test(t)) return "item";
  return "";
}
/* Toda gravação de histórico do app passa por aqui (historyEntry do core + tipo deduzido). */
function appHistoryEntry(text, extra) {
  const ex = extra && typeof extra === "object" ? extra : {};
  return historyEntry(text, { ...ex, tipo: ex.tipo || appHistoryTipo(text) });
}
const appShortDate = (iso) => { if (!iso) return "sem data"; const p = String(iso).split("-"); return p.length === 3 ? p[2] + "/" + p[1] : iso; };
const appContactCanal = (canal) => (canal === "tel" || canal === "phone" ? "ligacao" : canal === "mail" ? "email" : canal || "outro");

function ProsperaCRM() {

  const [view, setView] = useState(() => { const h = (window.location.hash || "").replace("#", ""); return VIEW_HASH[h] || "dashboard"; });
  const [query, setQuery] = useState("");
  const [filterStatus, setFilterStatus] = useState("todos");
  const [filterOwner, setFilterOwner] = useState("todos");
  const [sort, setSort] = useState({ key: "updatedAt", dir: "desc" });
  const [openId, setOpenId] = useState(null);

  const [formOpen, setFormOpen] = useState(false);
  const [editing, setEditing] = useState(null);
  const [requireFor, setRequireFor] = useState(null);

  const [toasts, setToasts] = useState([]);

  const mod = modules.find((m) => m.id === activeModId) || modules[0];

  const nextStepCtx = findIn(nextStepFor);

  /* ---- feedback ---- */
  const notify = useCallback((t) => {
    const id = uid();

  const dismissToast = (id) => setToasts((ts) => ts.filter((x) => x.id !== id));
  const askConfirm = (opts) => setConfirmState(opts);
  const openSettings = useCallback((tab) => { setSettingsTab(typeof tab === "string" ? tab : null); setSettingsOpen(true); setSidebarOpen(false); }, []);
  const plural = (n, um, varios) => n + " " + (n === 1 ? um : varios);

  /* ---- salvamento (com aviso quando o navegador recusa gravar) ---- */
  const reportSave = useCallback((kind, ok) => {
    const f = saveFail.current;
    if (ok) {
      if (f[kind]) { f[kind] = false; setSaveError(f.modules || f.settings); }

    }
    const wasFailing = f.modules || f.settings;

      notify({ kind: "error", duration: 12000, title: "Não foi possível salvar neste navegador",

  }, [notify, openSettings]);
  useEffect(() => { const ok = saveModules(modules); if (ok) setSavedAt(Date.now()); reportSave("modules", ok); }, [modules]);
  useEffect(() => { reportSave("settings", saveSettings(settings)); }, [settings]);
  const saveSettingsNow = (next) => setSettings(next);

  /* ---- primeiro commit: tira a tela de carregamento e avisa se algum dado salvo estava ilegível ---- */
  useEffect(() => {

        action: { label: "Ver backup", onClick: () => openSettings("backup") } });

  }, []);

  /* ---- URL: mantém o hash em dia e responde ao voltar/avançar do navegador ---- */
  useEffect(() => { try { window.history.replaceState(null, "", "#" + (view === "dashboard" ? "painel" : view)); } catch (e) {} }, [view]);
  useEffect(() => {

  /* ---- mutações ---- */
  const setModuleClients = (updater, modId = mod.id) =>

  /* Move de etapa de verdade (já passou pelas validações). Roda as automações, grava o histórico e oferece Desfazer.
     opts.client: cliente recém-criado (ainda fora do estado na closure); opts.modId: módulo (padrão: o ativo). */
  const commitMove = (id, status, extra = {}, opts = {}) => {
    const modId = opts.modId || mod.id;
    const m = modules.find((x) => x.id === modId) || mod;
    const before = m.clients.find((x) => x.id === id) || opts.client || null;
    if (!before || before.status === status) return;
    const label = statusMeta(status).label;
    /* Prévia (fora do updater) só para montar o aviso; o estado real é calculado dentro do updater. */
    const preview = runAutomations(settings, m, { ...before, ...extra, status }, { type: "enter_stage", status });
    const snapshot = before;
    setModuleClients((cs) => cs.map((x) => {
      if (x.id !== id || x.status === status) return x;
      const at = nowISO();
      let next = { ...x, ...extra, status, stageLog: [...(x.stageLog || []), { status, at }] };
      if (x.status === "perdido" && status !== "perdido") { next.motivoPerda = ""; next.motivoPerdaObs = ""; }
      const r = runAutomations(settings, m, next, { type: "enter_stage", status });
      next = r.client;

      const entries = [
        ...r.created.map((t) => appHistoryEntry("Tarefa automática criada: " + t, { tipo: "tarefa" })),
        appHistoryEntry("Etapa alterada para " + label + (motivo ? " (motivo: " + motivo + ")" : ""), { tipo: "etapa" }),
      ];

    const n = preview.created.length;

      notify({ title: "Movimento desfeito", message: snapshot.nome + " voltou para " + statusMeta(snapshot.status).label, kind: "info", duration: 2500 });

        setModules((ms) => {
          const left = ms.filter((x) => x.id !== id);
          if (left.length === 0) return ms;
          if (id === activeModId) setActiveModId(left[0].id);
          return left;
        });
        notify({ title: "Módulo excluído", kind: "info" });
      },
    });
  };
  const switchModule = (id) => { setActiveModId(id); setOpenId(null); setQuery(""); setFilterStatus("todos"); setFilterOwner("todos"); setSidebarOpen(false); };
  /* Abre a ficha de um cliente de qualquer módulo (troca o módulo se preciso, sem zerar os filtros). */
  const openClientIn = (modId, id, tab) => {

  const openClientHere = (id) => openClientIn(mod.id, id);

  const freshSettings = () => hydrateSettings(JSON.parse(JSON.stringify(DEFAULT_SETTINGS)));

  const importData = (payload) => {
    const data = Array.isArray(payload) ? { modules: payload, settings: null } : (payload || {});

      confirmLabel: "Importar", danger: true,
      onConfirm: () => {
        setModules(mods); setActiveModId(mods[0].id); setOpenId(null);
        if (nextSettings) setSettings(nextSettings);
        setSettingsOpen(false);
        notify({ title: "Backup importado", message: nextSettings ? "Clientes e configurações restaurados." : "Clientes restaurados." });
      },
    });
  };

  /* ---- equipe / exemplos / onboarding / planilha ---- */
  const detachRef = (kind, id) => {
    if (!id) return;

    if (!key) return;
    setModules((ms) => ms.map((m) => ({ ...m, clients: m.clients.map((c) => (c[key] === id ? { ...c, [key]: "" } : c)) })));

    askConfirm({

  const sorted = useMemo(() => {

  const heading = titles[view] || titles.dashboard;

  const sidebarProps = { modules, mod, view, settings, saveError, onSwitch: switchModule, onView: goView, onManage: () => { setModuleManagerOpen(true); setSidebarOpen(false); }, onSettings: openSettings, savedAt };

          }} />
      )}
      {moduleManagerOpen && <ModuleManager modules={modules} onClose={() => setModuleManagerOpen(false)} onAdd={addModule} onDelete={deleteModule} />}
      {settingsOpen && (
        <SettingsModal modules={modules} mod={mod} settings={settings} onSaveSettings={saveSettingsNow} savedAt={savedAt}
          onClose={() => setSettingsOpen(false)} onReset={resetData} onImport={importData} notify={notify} initialTab={settingsTab}
          saveError={saveError} onDetachRef={detachRef} onRemoveDemo={removeDemo} onImportClients={importClients} />
      )}
      {gate && gateClient && <StageGateModal status={gate.status} missing={gate.missing} client={gateClient} onFill={gateFill} onCancel={() => setGate(null)} />}
      {loss && lossClient && <LossReasonModal settings={settings} client={lossClient} onConfirm={lossConfirm} onCancel={() => setLoss(null)} />}
      {nextStepCtx.client && (
        <NextStepModal client={nextStepCtx.client} mod={nextStepCtx.mod} settings={settings}
          onPick={nextStepPick} onSkip={() => setNextStepFor(null)} onCancel={() => setNextStepFor(null)} />
      )}
      {contactCtx.client && (
        <ContactLogModal client={contactCtx.client} mod={contactCtx.mod} settings={settings}
          onConfirm={contactConfirm} onCancel={() => setContactFor(null)} />
      )}
      {confirmState && <ConfirmDialog {...confirmState} onCancel={() => setConfirmState(null)} onConfirm={() => { const fn = confirmState.onConfirm; setConfirmState(null); fn && fn(); }} />}
      <Toasts toasts={toasts} onDismiss={dismissToast} />
    </div>
  );
}

/* Dias inteiros desde uma data ISO (null se a data não existir ou for inválida). */
function sidebarDaysSince(iso) {
  if (!iso) return null;
  const t = new Date(iso).getTime();
  if (isNaN(t)) return null;
  return Math.max(0, Math.floor((Date.now() - t) / 864e5));
}

/* Data para adiar uma tarefa em n dias: parte da data dela ou de hoje, o que for
   mais tarde. Assim "+1 dia" numa tarefa atrasada vira "amanhã" (e não "menos atrasada").
   Também usada pela Agenda (19-agenda.jsx). */
function dashPostponeDate(task, n) {
  const hoje = todayISO();
  const base = task && isValidISODate(task.data) && task.data > hoje ? task.data : hoje;
  return addDaysISO(base, n);
}

  const groups = [
    { key: "atrasadas", label: "Atrasadas", items: tasks.g.atrasadas, tone: "red" },
    { key: "hoje", label: "Hoje", items: tasks.g.hoje, tone: "brand" },
    { key: "proximos", label: "Próximos 7 dias", items: tasks.g.proximos, tone: "amber" },
    { key: "depois", label: "Depois", items: tasks.g.depois, tone: "slate" },
  ];
  let left = DASH_TASK_LIMIT;
  const shown = groups.map((g) => { const s = g.items.slice(0, Math.max(0, left)); left -= s.length; return { ...g, shown: s }; });
  const hidden = tasks.list.length - shown.reduce((s, g) => s + g.shown.length, 0);
  const late = tasks.g.atrasadas.length;
  const n = tasks.list.length;
  const subtitle = n
    ? n + (n === 1 ? " pendente" : " pendentes") + (late ? " · " + late + (late === 1 ? " atrasada" : " atrasadas") : "") + (multi ? " · todos os módulos" : "")

  const rowProps = { multi, onToggleTask, onPatchTask, onOpenIn };

        action={
          <div className="flex shrink-0 items-center gap-1.5">
            <DashChip active={soMeus} onClick={() => onSetSoMeus(!soMeus)} icon={<I.UserCheck size={13} />}

function Dashboard({ mod, clients, allModules, settings, onOpen, onOpenIn, onToggleTask, onPatchTask, onGo, onNew, onMove, onSetSoMeus, onRemoveDemo, onDismissChecklist, onOpenSettings }) {
  const mods = useMemo(() => (allModules && allModules.length ? allModules : [mod]), [allModules, mod]);
  const multi = mods.length > 1;
  const onboarding = settings.onboarding || {};

  /* KPIs do módulo atual (dinheiro sempre via dealValue). */
  const m = useMemo(() => {
    const total = clients.length;
    const by = Object.fromEntries(STATUSES.map((s) => [s.key, { n: 0, v: 0 }]));
    clients.forEach((c) => { const b = by[c.status] || by.lead; b.n += 1; b.v += dealValue(mod, c); });
    const decididos = by.fechado.n + by.perdido.n;
    const conv = decididos ? Math.round((by.fechado.n / decididos) * 100) : 0;
    const pipeline = by.lead.v + by.negociacao.v;
    return { total, by, conv, pipeline, decididos, ativos: total - by.perdido.n };
  }, [clients, mod]);

  /* Tarefas pendentes de TODOS os módulos, respeitando "Só meus". */
  const tasks = useMemo(() => {
    const list = [];
    allClients(mods).forEach(({ mod: m2, client: c }) => {
      if (!matchesSoMeus(settings, c)) return;
      pendingTasks(c).forEach((t) => list.push({ ...t, modId: m2.id, mod: m2, client: c, d: daysUntil(t.data) }));
    });
    const sorted = sortTasks(list);
    const g = { atrasadas: [], hoje: [], proximos: [], depois: [] };
    sorted.forEach((t) => { if (t.d == null) g.depois.push(t); else if (t.d < 0) g.atrasadas.push(t); else if (t.d === 0) g.hoje.push(t); else if (t.d <= 7) g.proximos.push(t); else g.depois.push(t); });
    return { list: sorted, g };
  }, [mods, settings]);

  const recent = useMemo(() => [...clients].sort((a, b) => (b.updatedAt || "").localeCompare(a.updatedAt || "")).slice(0, 5), [clients]);
  const activity = useMemo(() => {
    const list = [];
    clients.forEach((c) => (c.history || []).forEach((h) => list.push({ ...h, cliente: c.nome, clientId: c.id })));
    return list.sort((a, b) => (b.at || "").localeCompare(a.at || "")).slice(0, 8);
  }, [clients]);

  /* Clientes parados além do prazo da etapa (SLA) ou perto dele, em todos os módulos. */
  const attention = useMemo(() => {
    const list = [];
    allClients(mods).forEach(({ mod: m2, client: c }) => {
      if (!matchesSoMeus(settings, c)) return;
      const sla = slaStatus(settings, c);
      if (sla.state === "late" || sla.state === "warn") list.push({ mod: m2, c, sla });
    });
    list.sort((a, b) => b.sla.days - a.sla.days);
    return { list, late: list.filter((x) => x.sla.state === "late").length, warn: list.filter((x) => x.sla.state === "warn").length };
  }, [mods, settings]);

  /* Pontuação dos clientes em aberto do módulo atual: quem merece contato primeiro. */
  const priority = useMemo(() => {
    const open = clients.filter((c) => c.status === "lead" || c.status === "negociacao");
    const scored = open.map((c) => ({ c, s: scoreClient(settings, mod, c), v: dealValue(mod, c) })).sort((a, b) => b.s.points - a.s.points);
    const dist = { alta: 0, media: 0, baixa: 0 };
    scored.forEach((x) => { dist[x.s.level] = (dist[x.s.level] || 0) + 1; });
    return { top: scored.slice(0, 5), dist, total: open.length };
  }, [clients, settings, mod]);

  /* Metas: valor fechado no mês atual por vendedor, somando todos os módulos. */
  const goals = useMemo(() => {
    const vendedores = (settings && settings.vendedores) || [];
    const rows = vendedores.map((v) => {
      let valor = 0, fechados = 0;
      mods.forEach((m2) => (m2.clients || []).forEach((c) => {
        if (c.status !== "fechado" || c.responsavel !== v.id) return;
        const at = closedAt(c);
        if (!at || !isSameMonth(at)) return;
        valor += dealValue(m2, c); fechados += 1;
      }));
      const meta = Number(v.metaMensal) || 0;
      return { v, valor, fechados, meta, pct: meta > 0 ? Math.round((valor / meta) * 100) : 0 };
    });
    const totalValor = rows.reduce((s, r) => s + r.valor, 0), totalMeta = rows.reduce((s, r) => s + r.meta, 0);
    return { rows, totalValor, totalMeta, pct: totalMeta > 0 ? Math.round((totalValor / totalMeta) * 100) : 0 };
  }, [mods, settings]);
  const mesLabel = dashCapitalize(new Date().toLocaleDateString("pt-BR", { month: "long", year: "numeric" }));

  /* Onboarding: exemplos e checklist. */
  const hasDemo = hasDemoClients(mods);
  const realCount = countRealClients(mods);
  const steps = [
    { key: "eu", label: "Definir quem sou eu", hint: "Para filtrar o que é seu e assinar as notas", done: !!settings.usuarioAtual, onClick: () => onOpenSettings("equipe") },
    { key: "cliente", label: "Cadastrar o primeiro cliente", hint: "Leva menos de um minuto", done: realCount > 0, onClick: onNew },
    { key: "demo", label: "Remover os exemplos", hint: "Fica só o que é seu", done: !hasDemo, onClick: onRemoveDemo },
    { key: "backup", label: "Exportar um backup", hint: "Uma cópia de segurança dos seus dados", done: !!onboarding.lastBackupAt, onClick: () => onOpenSettings("backup") },
  ];
  const showChecklist = !onboarding.checklistDismissed && steps.some((s) => !s.done);
  const tasksCardProps = { tasks, multi, settings, onSetSoMeus, onToggleTask, onPatchTask, onOpenIn, onGo, onOpenSettings };
  const SCORE_ORDER = ["alta", "media", "baixa"];

  if (clients.length === 0) {
    return (
      <div className="space-y-5">
        {showChecklist && <DashChecklist steps={steps} onDismiss={onDismissChecklist} />}
        {hasDemo && <DashDemoBanner onRemoveDemo={onRemoveDemo} />}
        <Card>
          <EmptyState icon={I.Inbox} title={"Nenhum cliente em " + mod.nome} text="Cadastre o primeiro cliente deste módulo para ver o painel ganhar vida."
            action={<button onClick={onNew} className={btn.primary}><I.Plus size={18} /> Cadastrar cliente</button>} />
        </Card>
        {tasks.list.length > 0 && <DashTasksCard {...tasksCardProps} />}
      </div>
    );
  }

  return (
    <div className="space-y-5">
      {showChecklist && <DashChecklist steps={steps} onDismiss={onDismissChecklist} />}
      {hasDemo && <DashDemoBanner onRemoveDemo={onRemoveDemo} />}

      <div className="grid grid-cols-1 gap-4 sm:grid-cols-2 xl:grid-cols-4">
        <KpiCard icon={I.Users} label="Clientes ativos" value={m.ativos} sub={m.total + " no total · " + m.by.perdido.n + " perdido(s)"} tone="brand" />
        <KpiCard icon={I.Trend} label="Em negociação" value={m.by.negociacao.n} sub={BRL(m.pipeline) + " em pipeline (lead + negociação)"} tone="amber" />
        <KpiCard icon={I.Handshake} label="Negócios fechados" value={m.by.fechado.n} sub={BRL(m.by.fechado.v) + " em negócios fechados"} tone="green" />
        <KpiCard icon={I.Target} label="Taxa de conversão" value={m.conv + "%"} sub={m.by.fechado.n + " fechado(s) de " + m.decididos + " decidido(s)"} tone="violet" />
      </div>

      <div className="grid grid-cols-1 gap-5 lg:grid-cols-3">
        <DashTasksCard {...tasksCardProps} className="lg:col-span-2" />

        <Card>
          <CardHeader title="Funil por etapa" subtitle={"Clientes e valor em cada etapa · " + mod.nome}
            action={<button type="button" onClick={() => onGo("funil")} className="inline-flex shrink-0 items-center gap-1 text-xs font-semibold text-brand hover:underline">Abrir funil <I.ChevR size={14} /></button>} />
          <div className="px-5 pb-5 pt-4">
            <div className="flex h-3 w-full gap-[2px] overflow-hidden rounded-full bg-slate-100" role="img" aria-label="Distribuição de clientes por etapa">
              {STATUSES.map((s) => {
                const pct = m.total ? (m.by[s.key].n / m.total) * 100 : 0;
                return pct > 0 ? <div key={s.key} className="h-full rounded-sm transition-all" style={{ width: pct + "%", background: s.color }} title={s.label + ": " + m.by[s.key].n} /> : null;
              })}
            </div>
            <ul className="mt-3 divide-y divide-slate-100">
              {STATUSES.map((s) => {
                const b = m.by[s.key];
                const pct = m.total ? Math.round((b.n / m.total) * 100) : 0;
                return (
                  <li key={s.key} className="py-2.5">
                    <div className="flex items-center gap-2 text-sm">
                      <span className="h-2.5 w-2.5 shrink-0 rounded-full" style={{ background: s.color }} />
                      <span className="min-w-0 flex-1 truncate font-medium text-slate-700">{s.label}</span>
                      <span className="w-8 shrink-0 text-right font-semibold text-ink tnum">{b.n}</span>
                      <span className="w-28 shrink-0 text-right text-xs text-slate-500 tnum">{BRL(b.v)}</span>
                    </div>
                    <div className="mt-1.5 flex items-center gap-2">
                      <ProgressBar value={b.n} max={m.total || 1} color={s.color} height={6} />

      <div className="grid grid-cols-1 gap-5 lg:grid-cols-3">
        <Card>
          <CardHeader title="Precisa de atenção" icon={I.Timer}

          <div className="px-3 pb-4 pt-3">
            {attention.list.length === 0 ? (
              <EmptyState icon={I.Check} title="Ninguém parado" text="Os prazos de cada etapa ficam em Configurações > Funil." />
            ) : (
              <ul className="space-y-0.5">
                {attention.list.slice(0, 6).map(({ mod: m2, c }) => (
                  <DashPersonRow key={m2.id + ":" + c.id} client={c} onClick={() => onOpenIn(m2.id, c.id)} right={<SlaBadge settings={settings} client={c} size="xs" />}>
                    <StatusBadge status={c.status} size="xs" />

                    {multi && <ModuleChip mod={m2} size="xs" />}

                ))}
              </ul>
            )}
            {attention.list.length > 6 && (
              <div className="mt-2 px-2 text-[11px] text-slate-400">+{attention.list.length - 6} outro(s) · <button type="button" onClick={() => onGo("clientes")} className="font-semibold text-brand hover:underline">ver na lista</button></div>

        <Card>

                    return pct > 0 ? <div key={k} className="h-full rounded-sm" style={{ width: pct + "%", background: SCORE_LEVELS[k].color }} title={SCORE_LEVELS[k].label + ": " + n} /> : null;
                  })}

                  ))}
                </div>
              </div>
            )}
            {priority.top.length === 0 ? (
              <EmptyState icon={I.Users} title="Nada em aberto" text="Cadastre novos leads para ver a prioridade aqui."

            ) : (
              <ul className="space-y-0.5">
                {priority.top.map(({ c, v }, i) => {
                  const im = interesseMeta(c.interesse);
                  return (

                        <span className="flex shrink-0 flex-col items-end gap-0.5">

                      }>
                      <OwnerChip settings={settings} id={c.responsavel} size="xs" />
                      {im && <span className="shrink-0" style={{ color: im.text }}>· interesse {im.label.toLowerCase()}</span>}
                      <NextStepBadge client={c} size="xs" />
                    </DashPersonRow>
                  );
                })}

            )}
          </div>
        </Card>

        <Card>
          <CardHeader title="Metas do mês" icon={I.Target} subtitle={mesLabel + " · todos os módulos"} />
          <div className="px-5 pb-5 pt-3">
            {goals.rows.length === 0 ? (
              <EmptyState icon={I.Target} title="Sem metas definidas" text="Cadastre os vendedores e as metas mensais em Configurações > Equipe e metas." />
            ) : (
              <div className="space-y-4">
                {goals.rows.map((r) => {
                  const hit = r.meta > 0 && r.valor >= r.meta;
                  return (
                    <div key={r.v.id}>
                      <div className="mb-1.5 flex items-center justify-between gap-2">
                        <OwnerChip settings={settings} id={r.v.id} />
                        <span className="shrink-0 text-xs text-slate-500 tnum"><b className="text-ink">{BRL(r.valor)}</b>{r.meta > 0 ? " de " + BRL(r.meta) : ""}</span>
                      </div>
                      <ProgressBar value={r.valor} max={r.meta || 1} color={hit ? "#047857" : "#3152E4"} height={8} />
                      <div className="mt-1 flex items-center justify-between gap-2 text-[11px] text-slate-400 tnum">
                        <span>{r.fechados} fechado(s) no mês</span>
                        <span className={hit ? "font-semibold text-emerald-700" : ""}>{r.meta > 0 ? (hit ? "Meta batida" : r.pct + "% · faltam " + BRL(r.meta - r.valor)) : "Sem meta definida"}</span>
                      </div>
                    </div>
                  );
                })}
                <div className="border-t border-slate-100 pt-3">
                  <div className="flex items-center justify-between gap-2 text-sm">
                    <span className="font-semibold text-ink">Equipe</span>

      <div className="grid grid-cols-1 gap-5 lg:grid-cols-3">

                    <div className="truncate text-xs text-slate-500">{c.empresa || "—"}{c.items.length ? " · " + c.items.length + " " + (c.items.length === 1 ? mod.itemLabel.toLowerCase() : mod.itemLabelPlural.toLowerCase()) : ""}</div>
                  </div>
                  <span className="hidden text-xs text-slate-400 sm:block">{relTime(c.updatedAt)}</span>
                  <StatusBadge status={c.status} size="xs" />
                </button>
              </li>
            ))}
          </ul>
        </Card>

        <Card>
          <CardHeader title="Atividade recente" icon={I.Activity} />
          <div className="px-5 pb-5 pt-3">
            {activity.length === 0 ? <p className="text-xs text-slate-400">Sem registros ainda.</p> : (
              <ol className="relative ml-1.5 border-l border-slate-200 pl-4">

                    </button>
                  </li>
                ))}
              </ol>
            )}
          </div>
        </Card>
      </div>
    </div>
  );
}

/* ----------------------------- Tabela de clientes ------------------------- */
/* Cabeçalho ordenável. Fica fora do render (contrato v4 §7): recebe sort/onSort por props. */
function ClientsTableTh({ k, sort, onSort, children, className = "", align = "left" }) {
  const active = sort.key === k;
  return (
    <th className={"whitespace-nowrap px-3 py-3 text-[11px] font-semibold uppercase tracking-wider text-slate-500 sm:px-4 " + className}>
      <button type="button" onClick={() => onSort({ key: k, dir: active && sort.dir === "asc" ? "desc" : "asc" })}
        aria-label={"Ordenar por " + (typeof children === "string" ? children : k)}
        className={"inline-flex items-center gap-1 rounded transition hover:text-ink focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-brand/30 " + (align === "right" ? "flex-row-reverse" : "") + (active ? " text-ink" : "")}>
        {children}
        <span className={active ? "text-brand" : "text-slate-300"}>{active ? (sort.dir === "asc" ? <I.ChevU size={13} /> : <I.ChevD size={13} />) : <I.Sort size={13} />}</span>
      </button>
    </th>
  );
}

/* Nome de arquivo seguro a partir do nome do módulo (sem acento, só letras/números e hífen). */
function clientsTableSlug(s) {
  const base = coreNormalizeText(s).replace(/[^a-z0-9]+/g, "-").replace(/^-+|-+$/g, "");
  return base || "modulo";
}

/* Uma linha da tabela. Fora do render para a lista não recriar o componente a cada render. */
function ClientsTableRow({ mod, c, settings, vendedores, onOpen, onMove, onPatch, onContactLink }) {
  const od = overdueTasks(c).length;
  const sla = slaStatus(settings, c);
  const days = daysInStage(c);
  const val = dealValue(mod, c);
  const origem = origemLabel(settings, c.origem);
  const nt = nextTask(c);
  const needs = needsNextStep(c);
  const owner = isKnownVendedor(settings, c.responsavel) ? c.responsavel : "";
  const stageDaysCls = sla.state === "late" ? "font-semibold text-red-600" : sla.state === "warn" ? "font-semibold text-amber-700" : sla.state === "ok" ? "text-slate-600" : "text-slate-400";
  const stop = (e) => e.stopPropagation();
  const onKey = (e) => {
    if (e.target !== e.currentTarget) return; /* teclas dentro de botões/selects não abrem a ficha */
    if (e.key === "Enter" || e.key === " ") { e.preventDefault(); onOpen(c.id); }
  };
  const changeOwner = (v) => {
    if (v === owner) return;
    onPatch(c.id, { responsavel: v }, "Responsável alterado para " + (vendedorNome(settings, v) || "sem responsável"));
  };

  return (
    <tr tabIndex={0} onClick={() => onOpen(c.id)} onKeyDown={onKey} aria-label={"Abrir " + c.nome}
      className="group cursor-pointer outline-none transition hover:bg-brand-50/40 focus-visible:bg-brand-50/60">
      {/* Cliente: no celular esta coluna também mostra empresa, etapa e valor */}
      <td className="px-3 py-2.5 sm:px-4 sm:py-3">
        <div className="flex items-center gap-2.5 sm:gap-3">
          <Avatar name={c.nome} size={32} className="sm:hidden" />
          <Avatar name={c.nome} size={36} className="hidden sm:flex" />
          <div className="min-w-0 max-w-[160px] sm:max-w-[200px] 2xl:max-w-[260px]">
            <div className="flex items-center gap-1.5 font-semibold text-ink">
              <span className="truncate">{c.nome}</span>
              {od > 0 && <span className="shrink-0 text-red-500" title={od + (od === 1 ? " tarefa atrasada" : " tarefas atrasadas")}><I.Alert size={14} /></span>}
            </div>
            <div className="hidden truncate text-xs text-slate-500 md:block">{c.email || "sem e-mail"}</div>
            <div className="hidden truncate text-[11px] text-slate-400 md:block 2xl:hidden">{owner ? "Resp.: " + vendedorNome(settings, owner) : "Sem responsável"}</div>
            <div className="truncate text-xs text-slate-500 md:hidden">{c.empresa || c.email || <span className="text-slate-300">sem empresa</span>}</div>
            <div className="mt-1 flex flex-wrap items-center gap-1.5 md:hidden">
              <StatusBadge status={c.status} size="xs" />
              <SlaBadge settings={settings} client={c} size="xs" hideOk />
              <NextStepBadge client={c} size="xs" />
              <span className="text-xs font-semibold text-ink tnum sm:hidden">{val ? BRL(val) : ""}</span>
            </div>
          </div>
        </div>
      </td>
      <td className="hidden px-3 py-3 sm:px-4 md:table-cell">
        <div className="max-w-[150px] truncate text-slate-700 2xl:max-w-[180px]">{c.empresa || <span className="text-slate-300">—</span>}</div>
        {origem && <div className="truncate text-[11px] text-slate-400">via {origem}</div>}
      </td>
      {/* Responsável: select pequeno que salva direto (sem abrir a ficha) */}
      <td className="hidden px-3 py-2 sm:px-4 2xl:table-cell" onClick={stop}>
        <Select small ariaLabel={"Responsável por " + c.nome} className="w-36" value={owner} onChange={changeOwner}
          placeholder="Sem responsável" options={vendedores.map((v) => ({ value: v.id, label: v.nome }))} />
      </td>
      <td className="hidden px-3 py-3 sm:px-4 md:table-cell">
        <div className="flex flex-wrap items-center gap-1.5">
          <StatusBadge status={c.status} />
          <SlaBadge settings={settings} client={c} size="xs" hideOk />
        </div>
      </td>
      <td className="hidden px-3 py-3 sm:px-4 md:table-cell"><ScoreBadge settings={settings} mod={mod} client={c} size="xs" /></td>
      <td className="hidden px-3 py-3 sm:px-4 lg:table-cell">
        <div className="max-w-[200px]">
          {nt ? <NextTaskLine client={c} size="xs" /> : needs ? <NextStepBadge client={c} size="xs" /> : <span className="text-xs text-slate-300">—</span>}
        </div>
      </td>
      <td className="hidden px-3 py-3 text-right text-slate-600 tnum sm:px-4 2xl:table-cell">{c.items.length}</td>
      <td className="hidden px-3 py-3 text-right font-semibold text-ink tnum sm:table-cell sm:px-4">{val ? BRL(val) : <span className="font-normal text-slate-300">—</span>}</td>
      <td className={"hidden px-3 py-3 text-right text-xs tnum sm:px-4 2xl:table-cell " + stageDaysCls} title={sla.label}>
        {days}{days === 1 ? " dia" : " dias"}
      </td>
      <td className="hidden px-3 py-3 text-right text-xs text-slate-400 sm:px-4 2xl:table-cell">{relTime(c.updatedAt)}</td>
      {/* Ações rápidas: WhatsApp / Ligar / E-mail + Mover etapa. Clique aqui não abre a ficha. */}
      <td className="px-1.5 py-2 sm:px-3" onClick={stop}>
        <div className="flex flex-wrap items-center justify-end gap-1 sm:flex-nowrap">
          <ContactIcons client={c} size="xs" onLog={(canal) => onContactLink(c.id, canal)} />
          <StatusMenu compact value={c.status} onChange={(s) => onMove(c.id, s)} align="right" />
        </div>
      </td>
      <td className="hidden pr-3 text-slate-300 group-hover:text-brand md:table-cell"><I.ChevR size={18} /></td>
    </tr>
  );
}

  return (
    <Card className="overflow-hidden">

          : <EmptyState icon={I.Inbox} title={"Nenhum cliente em " + mod.nome} text="Cadastre o primeiro cliente deste módulo." action={<button onClick={onNew} className={btn.primary}><I.Plus size={18} /> Cadastrar cliente</button>} />
      ) : (
        <>
          <div className="overflow-x-auto">
            {/* Sem largura mínima no celular: a tabela se ajusta a 390px. A partir de md volta a ter 900px e rola na horizontal. */}
            <table className="w-full text-sm md:min-w-[900px]">
              <thead className="border-b border-slate-200 bg-slate-50/80">
                <tr>

function drawerCopyFallback(text) {
  try {
    const ta = document.createElement("textarea");
    ta.value = text; ta.setAttribute("readonly", "");
    ta.style.position = "fixed"; ta.style.opacity = "0"; ta.style.top = "0";
    document.body.appendChild(ta); ta.select();
    const ok = document.execCommand("copy");
    ta.remove();
    return ok;
  } catch (e) { return false; }
}
function drawerCopyText(text) {
  if (navigator.clipboard && navigator.clipboard.writeText) {
    return navigator.clipboard.writeText(text).then(() => true).catch(() => drawerCopyFallback(text));
  }
  return Promise.resolve(drawerCopyFallback(text));
}
const drawerDays = (n) => { if (n < 1) return "menos de 1 dia"; const r = Math.round(n); return r + (r === 1 ? " dia" : " dias"); };
/* "YYYY-MM-DD" → "dd/mm" (texto curto do histórico de adiamento). */

const drawerEscRe = (s) => String(s || "").replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
/* Textarea de 1 linha que cresce conforme o texto. */
function drawerAutoGrow(el) {
  if (!el) return;
  el.style.height = "auto";
  el.style.height = Math.min(el.scrollHeight, 160) + "px";
}
/* Tipo de uma entrada do histórico: usa h.tipo (v4) ou deduz pelo texto (dados antigos). */
function drawerHistoryTipo(h, mod) {
  if (h && h.tipo) return h.tipo;
  const t = (h && h.text) || "";
  if (/^Etapa alterada/i.test(t)) return "etapa";
  if (/^Tarefa/i.test(t)) return "tarefa";
  if (/^Nota/i.test(t)) return "nota";
  if (/^(Cliente cadastrado|Importad)/i.test(t)) return "cadastro";
  if (/^Mensagem/i.test(t)) return "mensagem";
  if (/^Proposta/i.test(t)) return "proposta";
  if (/^(WhatsApp aberto|Ligação iniciada|E-mail aberto|Ligação:|WhatsApp:|E-mail:|Reunião:|Contato)/i.test(t)) return "contato";
  if (/^(Dados do cliente|Origem |Responsável |Porte |Interesse )/i.test(t)) return "dados";
  const label = mod && mod.itemLabel ? drawerEscRe(mod.itemLabel) : "Item";
  if (new RegExp("^(Item|" + label + ") ", "i").test(t) || /marcado como (contratado|de interesse)/i.test(t)) return "item";

}

    if (!titulo) return;
